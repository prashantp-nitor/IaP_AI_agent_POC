name: Deploy Existing Helm Workload

on:
  push:
    branches:
      - "main"
    paths:
      - ".deploy/helm-release.json"
      - "deployment-output/**"
  workflow_dispatch:
    inputs:
      job_id:
        description: "DaaS Job ID"
        required: false
        default: "5696b1d8-e56a-4e68-8a1a-580e650b15ea"

permissions:
  id-token: write
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      job_id: ${{ steps.validate.outputs.job_id }}
      dispatch_id: ${{ steps.validate.outputs.dispatch_id }}
      manifest_path: ${{ steps.validate.outputs.manifest_path }}
      target_key: ${{ steps.validate.outputs.target_key }}
      project_name: ${{ steps.validate.outputs.project_name }}
      cluster_name: ${{ steps.validate.outputs.cluster_name }}
      resource_group: ${{ steps.validate.outputs.resource_group }}
      namespace: ${{ steps.validate.outputs.namespace }}
      acr_registry: ${{ steps.validate.outputs.acr_registry }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Dispatch Metadata
        id: validate
        run: |
          python3 -c '
          import json, os, sys

          dispatch_file = ".deploy/helm-release.json"
          if not os.path.exists(dispatch_file):
              sys.stderr.write(f"Dispatch metadata not found: {dispatch_file}\n")
              sys.exit(1)

          with open(dispatch_file, "r", encoding="utf-8") as f:
              dispatch = json.load(f)

          manifest_path = dispatch.get("manifest_path")
          if not manifest_path:
              project_name = dispatch.get("project_name", "")
              manifest_path = f"deployment-output/{project_name}/.existing-helm-release.json"

          if not os.path.exists(manifest_path):
              sys.stderr.write(f"Release manifest not found: {manifest_path}\n")
              sys.exit(1)

          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = json.load(f)

          # Parity validation between dispatch metadata and release manifest
          for key in ["schema_version", "job_id", "discovery_revision", "config_digest"]:
              d_val = str(dispatch.get(key, ""))
              m_val = str(manifest.get(key, ""))
              if d_val != m_val:
                  sys.stderr.write(f"Dispatch/manifest parity failure on {key}: {d_val} != {m_val}\n")
                  sys.exit(1)

          rg = dispatch.get("resource_group") or manifest.get("resource_group", "")
          cluster = dispatch.get("cluster_name") or manifest.get("cluster_name", "")
          ns = dispatch.get("namespace") or manifest.get("namespace", "default")
          target_key = f"{rg}/{cluster}/{ns}".strip("/").lower()
          project_name = dispatch.get("project_name") or manifest.get("project_name", "")
          acr_reg = dispatch.get("acr_registry") or manifest.get("pull_secret", {}).get("registry", "")

          output_file = os.environ.get("GITHUB_OUTPUT")
          if output_file:
              with open(output_file, "a", encoding="utf-8") as out:
                  out.write(f"job_id={dispatch.get(\"job_id\", \"\")}\n")
                  out.write(f"dispatch_id={dispatch.get(\"dispatch_id\", \"\")}\n")
                  out.write(f"manifest_path={manifest_path}\n")
                  out.write(f"target_key={target_key}\n")
                  out.write(f"project_name={project_name}\n")
                  out.write(f"cluster_name={cluster}\n")
                  out.write(f"resource_group={rg}\n")
                  out.write(f"namespace={ns}\n")
                  out.write(f"acr_registry={acr_reg}\n")
          '

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    concurrency:
      group: existing-helm-${{ needs.prepare.outputs.target_key }}
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4

      - name: Connect to AKS Cluster
        run: |
          az aks get-credentials --resource-group ${{ needs.prepare.outputs.resource_group }} --name ${{ needs.prepare.outputs.cluster_name }} --overwrite-existing

      - name: Install Helm v3.19.0
        uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'

      - name: Deploy Existing Helm Releases
        id: deploy_releases
        env:
          JOB_ID: ${{ needs.prepare.outputs.job_id }}
        run: |
          python .github/scripts/deploy_existing_helm.py \
            --dispatch-file .deploy/helm-release.json \
            --workspace "$GITHUB_WORKSPACE" \
            --output-file /tmp/existing-helm-deploy-result.json

      - name: Save Execution Outputs
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOB_ID: ${{ needs.prepare.outputs.job_id }}
        run: |
          python .github/scripts/save_existing_helm_outputs.py \
            --dispatch-file .deploy/helm-release.json \
            --result-file /tmp/existing-helm-deploy-result.json \
            --commit-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --workflow-status "${{ job.status }}"