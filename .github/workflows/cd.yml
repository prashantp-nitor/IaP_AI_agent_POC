name: Deploy DaaS Workload via Helm

on:
  push:
    branches:
      - "feature/update-pipeline"
      
      - "networking"
      
    paths:
      - "deployment-output/test-demo-22/**"
      - "deployment-output/**"
  workflow_dispatch:
    inputs:
      job_id:
        description: "DaaS Job ID"
        required: false
        default: "80777f5c-8330-4133-87e9-dfb5d6ef8333"
      image_tag:
        description: "Container Image Tag"
        required: false
        default: "sha-80777f5c"

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: azdaasdeployment.azurecr.io
  NAMESPACE: test-demo-22
  JOB_ID: ${{ inputs.job_id || '80777f5c-8330-4133-87e9-dfb5d6ef8333' }}

jobs:
  deploy-to-kubernetes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Resolve Target Cluster & Key Vault
        id: resolve_target
        run: |
          DEPLOY_TARGET_FILE="deployment-output/test-demo-22/.deploy-target"
          if [ ! -f "$DEPLOY_TARGET_FILE" ]; then
            DEPLOY_TARGET_FILE="deployment-output/${{ env.NAMESPACE }}/.deploy-target"
          fi
          if [ ! -f "$DEPLOY_TARGET_FILE" ]; then
            echo "Error: No .deploy-target file found at $DEPLOY_TARGET_FILE"
            exit 1
          fi
          CLUSTER_NAME=$(yq e '.cluster_name' $DEPLOY_TARGET_FILE)
          RESOURCE_GROUP=$(yq e '.resource_group' $DEPLOY_TARGET_FILE)
          if [ -z "$RESOURCE_GROUP" ] || [ "$RESOURCE_GROUP" = "null" ] || [ "$RESOURCE_GROUP" = "daas-rg" ]; then
            RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP || vars.AZURE_RESOURCE_GROUP || '' }}"
          fi
          KEY_VAULT_NAME=$(az keyvault list --resource-group $RESOURCE_GROUP --query "[0].name" -o tsv)
          
          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
          echo "resource_group=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
          echo "key_vault_name=$KEY_VAULT_NAME" >> $GITHUB_OUTPUT
          echo "project_dir=$(dirname $DEPLOY_TARGET_FILE)" >> $GITHUB_OUTPUT
          echo "helm_dir=$(dirname $DEPLOY_TARGET_FILE)/helm" >> $GITHUB_OUTPUT

      - name: Set up Kubeconfig
        run: |
          az aks get-credentials --resource-group ${{ steps.resolve_target.outputs.resource_group }} --name ${{ steps.resolve_target.outputs.cluster_name }} --overwrite-existing

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Create ACR Pull Secret in AKS
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry acr-pull-secret \
            --namespace ${{ env.NAMESPACE }} \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ secrets.REGISTRY_USERNAME }} \
            --docker-password=${{ secrets.REGISTRY_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -



      - name: Deploy via Helm
        run: |
          PROJECT_DIR="${{ steps.resolve_target.outputs.project_dir }}"
          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR" ]; then
            PROJECT_DIR="deployment-output/test-demo-22"
          fi
          if [ ! -d "$PROJECT_DIR" ]; then
            PROJECT_DIR="deployment-output/${{ env.NAMESPACE }}"
          fi
          echo "Looking for Helm charts in $PROJECT_DIR..."

          # Discover all directories with Chart.yaml
          CHART_DIRS=$(find "$PROJECT_DIR" -mindepth 1 -maxdepth 2 -name "Chart.yaml" -exec dirname {} \;)
          if [ -z "$CHART_DIRS" ]; then
            if [ -d "./${{ steps.resolve_target.outputs.helm_dir }}" ]; then
              CHART_DIRS="./${{ steps.resolve_target.outputs.helm_dir }}"
            else
              echo "Error: No Helm charts found in $PROJECT_DIR"
              exit 1
            fi
          fi

          for chart_path in $CHART_DIRS; do
            CHART_NAME=$(yq e '.name' "$chart_path/Chart.yaml" 2>/dev/null || echo "test-demo-22")
            if [ -z "$CHART_NAME" ] || [ "$CHART_NAME" = "null" ]; then
              CHART_NAME="test-demo-22"
            fi
            echo "=========================================="
            echo "Deploying Helm chart: $CHART_NAME from $chart_path"
            echo "=========================================="

            helm upgrade --install "$CHART_NAME" "$chart_path" --namespace "${{ env.NAMESPACE }}" --create-namespace --set-string "global.registry=${{ env.REGISTRY }}" --set-string "global.deploymentStrategy=rolling" --set-string "services.backend.image.repository=${{ env.REGISTRY }}/backend" --set-string "services.backend.image.tag=${{ inputs.image_tag || 'sha-80777f5c' }}" --set-string "services.backend.namespace=test-demo-22" --set-string "services.frontend.image.repository=${{ env.REGISTRY }}/frontend" --set-string "services.frontend.image.tag=${{ inputs.image_tag || 'sha-80777f5c' }}" --set-string "services.frontend.namespace=test-demo-22" --timeout 5m0s
          done

      - name: Wait for Frontend LoadBalancer IP
        run: |
          echo "Waiting for Frontend LoadBalancer external IP..."
          FRONTEND_SVC="frontend"
          FRONTEND_NS="test-demo-22"
          if [ -z "$FRONTEND_NS" ]; then
            FRONTEND_NS="${{ env.NAMESPACE }}"
          fi
          if [ -z "$FRONTEND_SVC" ]; then
            echo "No frontend service found. Skipping LoadBalancer IP wait."
          else
            IP=""
            for i in {1..30}; do
              IP=$(kubectl get svc $FRONTEND_SVC -n $FRONTEND_NS -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
              if [ -z "$IP" ]; then
                IP=$(kubectl get svc $FRONTEND_SVC -n $FRONTEND_NS -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
              fi
              if [ ! -z "$IP" ]; then
                echo "Frontend LoadBalancer IP/Hostname assigned: $IP"
                break
              fi
              echo "Waiting for IP assignment (attempt $i/30)..."
              sleep 10
            done
            if [ -z "$IP" ]; then
              echo "Error: Frontend LoadBalancer IP assignment timed out."
              kubectl describe svc $FRONTEND_SVC -n $FRONTEND_NS
              exit 1
            fi
          fi

      - name: Retrieve Public IP & Report URL
        run: |
          echo "Retrieving public IP/hostname from frontend service..."
          FRONTEND_SVC="frontend"
          FRONTEND_NS="test-demo-22"
          if [ -z "$FRONTEND_NS" ]; then
            FRONTEND_NS="${{ env.NAMESPACE }}"
          fi
          if [ -z "$FRONTEND_SVC" ]; then
             echo "URL=None" >> $GITHUB_ENV
             echo "### ⚠️ Deployment Completed (No Frontend)" >> $GITHUB_STEP_SUMMARY
             exit 0
          fi
          
          IP=$(kubectl get svc $FRONTEND_SVC -n $FRONTEND_NS -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
          if [ -z "$IP" ]; then
            IP=$(kubectl get svc $FRONTEND_SVC -n $FRONTEND_NS -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          fi
          
          if [ -z "$IP" ]; then
            echo "Warning: Frontend IP/Hostname was not assigned."
            echo "URL=http://<pending-public-ip>" >> $GITHUB_ENV
            echo "### ⚠️ Deployment Completed (IP Pending)" >> $GITHUB_STEP_SUMMARY
          else
            URL="http://$IP"
            echo "URL=$URL" >> $GITHUB_ENV
            echo "### 🚀 Deployment Successfully Exposed!" >> $GITHUB_STEP_SUMMARY
            echo "Your application is publicly reachable at: **[$URL]($URL)**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Save Execution Outputs Directly to Database
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL || secrets.AZURE_POSTGRES_URL }}
          JOB_ID: ${{ env.JOB_ID }}
          PROVIDER: "azure"
          REGION: "westus"
          NAMESPACE: ${{ env.NAMESPACE }}
          PROJECT_NAME: "test-demo-22"
          DEPLOYMENT_STRATEGY: "rolling"
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          PUBLIC_URL: ${{ env.URL }}
          INFRA_OUTPUTS_JSON: '{"endpoints": [{"name": "backend", "is_frontend": false, "ports": [8080]},{"name": "frontend", "is_frontend": true, "ports": [80]}]}'
          DB_CONFIG_JSON: '{}'
        run: |
          echo "Saving deployment execution outputs directly to database via DATABASE_URL..."
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set. Skipping direct DB update."
            exit 0
          fi

          python3 -m pip install --quiet psycopg2-binary 2>/dev/null || true

          python3 .github/scripts/save_outputs.py

      - name: Cleanup on Failed Deployment
        if: failure()
        run: |
          echo "Deployment failed! Cleaning up resources to avoid inherited failures..."
          helm uninstall test-demo-22 -n ${{ env.NAMESPACE }} || true