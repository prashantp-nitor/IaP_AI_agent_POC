name: CI Security Scan and Container Build

on:
  push:
    branches:
      - "networking"
    paths:
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      job_id:
        description: "DaaS Job ID"
        required: true
        default: "7930f155-5bb4-470e-80a3-f9313c7c085a"

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  REGISTRY: azdaasdeployment.azurecr.io
  NAMESPACE: tier3app
  SOURCE_ZIP_URL: "https://daasstorageacct.blob.core.windows.net/deployment-source/7930f155-5bb4-470e-80a3-f9313c7c085a/source.zip?se=2026-08-26T11%3A21%3A08Z&sp=r&sv=2026-06-06&sr=b&sig=UhFM5AkDZYrlNAhO1j2X3ZFu0deTFPdsW3pJTJciVs8%3D"
  JOB_ID: ${{ inputs.job_id || '7930f155-5bb4-470e-80a3-f9313c7c085a' }}
  AZURE_SECURITY_REPORTS_CONTAINER: "security-reports"

jobs:
  ci-security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source artifact
        if: env.SOURCE_ZIP_URL != ''
        run: |
          curl --fail --location --retry 3 "${{ env.SOURCE_ZIP_URL }}" -o source.zip
          mkdir -p app
          unzip -q source.zip -d app

      - name: Set up Trivy Scanner
        uses: aquasecurity/setup-trivy@v0.2.2
        with:
          version: 'latest'

      - name: Run Gitleaks Secret Detection
        run: |
          mkdir -p security-reports
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.18.4 detect             --source="/repo"             --report-path="/repo/security-reports/gitleaks.json"             --report-format=json             --redact             --exit-code=0 || true
          sudo chmod -R 777 security-reports || true

      - name: Run Trivy Filesystem Scan (JSON & Summary)
        continue-on-error: true
        run: |
          mkdir -p security-reports
          echo "Executing Trivy filesystem scan..."
          trivy fs --format json --output security-reports/dependencies.json --severity CRITICAL,HIGH,MEDIUM,LOW . || true
          trivy fs --severity CRITICAL,HIGH,MEDIUM,LOW . || true
          sudo chmod -R 777 security-reports || true

      

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      
      - name: Build backend container image
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/backend:${{ github.sha }}
          
          
          

      - name: Run Trivy Image Scan for backend (JSON & Summary)
        continue-on-error: true
        run: |
          mkdir -p security-reports
          echo "Executing Trivy container image scan for backend..."
          trivy image --format json --output security-reports/image-backend.json --severity CRITICAL,HIGH,MEDIUM,LOW ${{ env.REGISTRY }}/backend:${{ github.sha }} || true
          trivy image --severity CRITICAL,HIGH,MEDIUM,LOW ${{ env.REGISTRY }}/backend:${{ github.sha }} || true
          sudo chmod -R 777 security-reports || true

      - name: Push backend image
        run: |
          docker push ${{ env.REGISTRY }}/backend:${{ github.sha }}
      
      - name: Build frontend container image
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          
          
          

      - name: Run Trivy Image Scan for frontend (JSON & Summary)
        continue-on-error: true
        run: |
          mkdir -p security-reports
          echo "Executing Trivy container image scan for frontend..."
          trivy image --format json --output security-reports/image-frontend.json --severity CRITICAL,HIGH,MEDIUM,LOW ${{ env.REGISTRY }}/frontend:${{ github.sha }} || true
          trivy image --severity CRITICAL,HIGH,MEDIUM,LOW ${{ env.REGISTRY }}/frontend:${{ github.sha }} || true
          sudo chmod -R 777 security-reports || true

      - name: Push frontend image
        run: |
          docker push ${{ env.REGISTRY }}/frontend:${{ github.sha }}
      

      - name: Upload Security Reports to Azure Blob Storage
        if: always()
        run: |
          mkdir -p security-reports
          sudo chmod -R 777 security-reports || true
          echo "Uploading security reports to Azure Blob container ${{ env.AZURE_SECURITY_REPORTS_CONTAINER }}/${{ env.JOB_ID }}..."
          if [ -n "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" ]; then
            az storage blob upload-batch               --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}"               --destination "${{ env.AZURE_SECURITY_REPORTS_CONTAINER }}"               --source security-reports/               --destination-path "${{ env.JOB_ID }}"               --overwrite || echo "Warning: Azure storage upload failed, relying on artifact fallback."
          else
            echo "AZURE_STORAGE_CONNECTION_STRING not configured in secrets. Using workflow artifact storage."
          fi

      - name: Upload Security Reports as Workflow Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ env.JOB_ID }}
          path: security-reports/
          retention-days: 30