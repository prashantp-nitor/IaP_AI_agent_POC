# DaaS CI Dispatch: 8bfa978d-a5d6-47e8-94d0-f4e30d4ac7c7
name: CI Security Scan and Container Build

on:
  push:
    branches:
      - "feature/update-pipeline"
    paths:
      - ".github/workflows/ci.yml"

  workflow_dispatch:
    inputs:
      job_id:
        description: "DaaS Job ID"
        required: true
        default: "8bfa978d-a5d6-47e8-94d0-f4e30d4ac7c7"

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  REGISTRY: ${{ secrets.ACR_NAME != '' && format('{0}.azurecr.io', secrets.ACR_NAME) || vars.ACR_NAME != '' && format('{0}.azurecr.io', vars.ACR_NAME) || '' }}
  NAMESPACE: test-demo-29
  SOURCE_ZIP_URL: "https://daasstorageacct.blob.core.windows.net/deployment-source/8bfa978d-a5d6-47e8-94d0-f4e30d4ac7c7/source.zip?se=2026-10-29T07%3A52%3A26Z&sp=r&sv=2026-06-06&sr=b&sig=fLgJeri6z0sScAck3XfW7HDNTGAX/HQcg3FhaYwgzNQ%3D"
  JOB_ID: ${{ inputs.job_id || '8bfa978d-a5d6-47e8-94d0-f4e30d4ac7c7' }}
  AZURE_SECURITY_REPORTS_CONTAINER: "security-reports"
  PROJECT_PREFIX: "7A2B184E_F951_41F7_96D8_A97BAF0C86CA"

jobs:
  ci-security-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source artifact
        if: env.SOURCE_ZIP_URL != ''
        run: |
          curl --fail --location --retry 3 "${SOURCE_ZIP_URL}" -o source.zip
          mkdir -p app
          unzip -q source.zip -d app

      - name: Cache Maven Dependencies
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        continue-on-error: true
        with:
          method: "universal"
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG || vars.INFISICAL_PROJECT_SLUG || '' }}
          env-slug: ${{ secrets.INFISICAL_ENV_SLUG || vars.INFISICAL_ENV_SLUG || 'dev' }}
          domain: ${{ secrets.INFISICAL_DOMAIN || vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}

      - name: Install Trivy Scanner
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            echo "Installing Trivy via official apt repository..."
            sudo apt-get update -y
            sudo apt-get install -y wget apt-transport-https gnupg lsb-release

            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
              | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg

            echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
              | sudo tee /etc/apt/sources.list.d/trivy.list

            sudo apt-get update -y
            sudo apt-get install -y trivy
          fi

          trivy --version

      - name: Run Gitleaks Secret Detection
        run: |
          mkdir -p security-reports

          SCAN_DIR="/repo"
          if [ -d "$GITHUB_WORKSPACE/app" ]; then
            SCAN_DIR="/repo/app"
          fi

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.18.4 detect \
            --no-git \
            --source="$SCAN_DIR" \
            --report-path="/repo/security-reports/gitleaks.json" \
            --report-format=json \
            --redact \
            --exit-code=0 || true

      - name: Run Trivy Filesystem Scan
        continue-on-error: true
        run: |
          mkdir -p security-reports

          SCAN_DIR="."
          if [ -d "app" ]; then
            SCAN_DIR="app"
          fi

          echo "Executing Trivy filesystem scan on $SCAN_DIR..."

      - name: Configure SonarCloud Properties
        run: |
          cat << 'EOF' > sonar-project.properties
          sonar.host.url=https://sonarcloud.io
          sonar.organization=daas-poc
          sonar.projectKey=vaibhaav-nitor_3-tier-app-fitcart
          sonar.sources=app
          sonar.exclusions=**/*.tf,deployment-output/**,.github/**
          sonar.scm.exclusions.disabled=true
          EOF

      - name: Run SonarQube / SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        continue-on-error: true
        env:
          SONAR_TOKEN: "[REDACTED_GENERIC_API_KEY_5]"
          SONAR_HOST_URL: "https://sonarcloud.io"
        with:
          args: >-
            -Dsonar.organization=daas-poc
            -Dsonar.projectKey=vaibhaav-nitor_3-tier-app-fitcart
            -Dsonar.sources=app
            -Dsonar.exclusions=**/*.tf,deployment-output/**,.github/**
            -Dsonar.scm.exclusions.disabled=true

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME || secrets.ACR_username || secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD || secrets.ACR_password || secrets.REGISTRY_PASSWORD }}

      - name: Build backend container image
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/backend:sha-7a2b184e

      - name: Run Trivy Image Scan for backend
        continue-on-error: true
        run: |
          mkdir -p security-reports

          trivy image \
            --format json \
            --output security-reports/image-backend.json \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            "${REGISTRY}/backend:sha-7a2b184e" || true

          trivy image \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            "${REGISTRY}/backend:sha-7a2b184e" || true

      - name: Push backend image
        run: |
          docker push "${REGISTRY}/backend:sha-7a2b184e"

      - name: Build frontend container image
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/frontend:sha-7a2b184e

      - name: Run Trivy Image Scan for frontend
        continue-on-error: true
        run: |
          mkdir -p security-reports

          trivy image \
            --format json \
            --output security-reports/image-frontend.json \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            "${REGISTRY}/frontend:sha-7a2b184e" || true

          trivy image \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            "${REGISTRY}/frontend:sha-7a2b184e" || true

      - name: Push frontend image
        run: |
          docker push ${{ env.REGISTRY }}/frontend:sha-7a2b184e

      - name: Upload Security Reports to Azure Blob Storage
        if: always()
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          mkdir -p security-reports

          echo "Uploading security reports to Azure Blob container ${AZURE_SECURITY_REPORTS_CONTAINER}/${JOB_ID}..."

          if [ -n "$AZURE_STORAGE_CONNECTION_STRING" ]; then
            az storage blob upload-batch \
              --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
              --destination "$AZURE_SECURITY_REPORTS_CONTAINER" \
              --source security-reports/ \
              --destination-path "$JOB_ID" \
              --overwrite \
              || echo "Warning: Azure storage upload failed; relying on artifact fallback."
          else
            echo "Azure storage connection string not configured. Using workflow artifact storage."
          fi

      - name: Upload Security Reports as Workflow Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ env.JOB_ID }}
          path: security-reports/
          retention-days: 30
