# DaaS CI Dispatch: 5ad5d29e-d3c6-4dcf-9521-5d8a75d22f08 @ 2026-10-23T11:30:17Z
name: CI Security Scan and Container Build

on:
  push:
    branches:
      - "feature/test-custom-acr-login"
    paths:
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      job_id:
        description: "DaaS Job ID"
        required: true
        default: "5ad5d29e-d3c6-4dcf-9521-5d8a75d22f08"

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  REGISTRY: testdemo23acr32ceb7.azurecr.io
  NAMESPACE: test-demo-23
  SOURCE_ZIP_URL: "https://daasstorageacct.blob.core.windows.net/deployment-source/5ad5d29e-d3c6-4dcf-9521-5d8a75d22f08/source.zip?se=2026-10-23T12%3A30%3A17Z&sp=r&sv=2026-06-06&sr=b&sig=s9QyZAjf2EBhruydWibpAidfh7ExKXMHuf/bsWybpj8%3D"
  JOB_ID: ${{ inputs.job_id || '5ad5d29e-d3c6-4dcf-9521-5d8a75d22f08' }}
  AZURE_SECURITY_REPORTS_CONTAINER: "security-reports"
  PROJECT_PREFIX: "5AD5D29E_D3C6_4DCF_9521_5D8A75D22F08"

jobs:
  ci-security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source artifact
        if: env.SOURCE_ZIP_URL != ''
        run: |
          curl --fail --location --retry 3 "${{ env.SOURCE_ZIP_URL }}" -o source.zip
          mkdir -p app
          unzip -q source.zip -d app

      - name: Cache Maven Dependencies
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        continue-on-error: true
        with:
          method: "universal"
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG || vars.INFISICAL_PROJECT_SLUG || '' }}
          env-slug: ${{ secrets.INFISICAL_ENV_SLUG || vars.INFISICAL_ENV_SLUG || 'dev' }}
          domain: ${{ secrets.INFISICAL_DOMAIN || vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}

      - name: Install Trivy Scanner
        run: |
          if ! command -v trivy &> /dev/null; then
            echo "Installing Trivy via official apt repository..."
            sudo apt-get install -y wget apt-transport-https gnupg lsb-release
            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
            echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
            sudo apt-get update -y && sudo apt-get install -y trivy || (curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin) || true
          fi
          trivy --version || echo "Trivy installed"

      - name: Run Gitleaks Secret Detection
        run: |
          mkdir -p security-reports
          SCAN_DIR="/repo"
          if [ -d "$GITHUB_WORKSPACE/app" ]; then
            SCAN_DIR="/repo/app"
          fi
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.18.4 detect             --no-git             --source="$SCAN_DIR"             --report-path="/repo/security-reports/gitleaks.json"             --report-format=json             --redact             --exit-code=0 || true
          sudo chmod -R 777 security-reports || true

      - name: Run Trivy Filesystem Scan (JSON & Summary)
        continue-on-error: true
        run: |
          mkdir -p security-reports
          SCAN_DIR="."
          if [ -d "app" ]; then
            SCAN_DIR="app"
          fi
          echo "Executing Trivy filesystem scan on $SCAN_DIR..."
          trivy fs --format json --output security-reports/dependencies.json --severity CRITICAL,HIGH,MEDIUM,LOW "$SCAN_DIR" || true
          trivy fs --severity CRITICAL,HIGH,MEDIUM,LOW "$SCAN_DIR" || true
          sudo chmod -R 777 security-reports || true

      
      - name: Normalize Infisical Sonar Credentials
        continue-on-error: true
        run: |
          PREFIX="${{ env.PROJECT_PREFIX }}"
          JOB_ID="${{ env.JOB_ID }}"
          CLEAN_JOB_ID="$(echo "$JOB_ID" | tr '[:lower:]' '[:upper:]' | tr -c 'A-Z0-9_' '_' | sed 's/^_//;s/_$//')"

          if [ -n "$PREFIX" ]; then
            TOKEN_VAR="${PREFIX}_SONAR_TOKEN"
            HOST_VAR="${PREFIX}_SONAR_HOST_URL"
            ORG_VAR="${PREFIX}_SONAR_ORGANIZATION"
            KEY_VAR="${PREFIX}_SONAR_PROJECT_KEY"

            TOKEN_VAL="$(eval "echo \${$TOKEN_VAR:-}")"
            HOST_VAL="$(eval "echo \${$HOST_VAR:-}")"
            ORG_VAL="$(eval "echo \${$ORG_VAR:-}")"
            KEY_VAL="$(eval "echo \${$KEY_VAR:-}")"

            if [ -n "$TOKEN_VAL" ] && [ -z "${SONAR_TOKEN:-}" ]; then
              echo "SONAR_TOKEN=$TOKEN_VAL" >> $GITHUB_ENV
              SONAR_TOKEN="$TOKEN_VAL"
            fi
            if [ -n "$HOST_VAL" ] && [ -z "$SONAR_HOST_URL" ]; then
              echo "SONAR_HOST_URL=$HOST_VAL" >> $GITHUB_ENV
              SONAR_HOST_URL="$HOST_VAL"
            fi
            if [ -n "$ORG_VAL" ] && [ -z "${SONAR_ORGANIZATION:-}" ]; then
              echo "SONAR_ORGANIZATION=$ORG_VAL" >> $GITHUB_ENV
              SONAR_ORGANIZATION="$ORG_VAL"
            fi
            if [ -n "$KEY_VAL" ] && [ -z "${SONAR_PROJECT_KEY:-}" ]; then
              echo "SONAR_PROJECT_KEY=$KEY_VAL" >> $GITHUB_ENV
              SONAR_PROJECT_KEY="$KEY_VAL"
            fi
          fi

          if [ -z "${SONAR_TOKEN:-}" ] && [ -n "$CLEAN_JOB_ID" ] && [ "$CLEAN_JOB_ID" != "$PREFIX" ]; then
            JOB_TOKEN_VAR="${CLEAN_JOB_ID}_SONAR_TOKEN"
            JOB_TOKEN_VAL="$(eval "echo \${$JOB_TOKEN_VAR:-}")"
            if [ -n "$JOB_TOKEN_VAL" ]; then
              echo "SONAR_TOKEN=$JOB_TOKEN_VAL" >> $GITHUB_ENV
              SONAR_TOKEN="$JOB_TOKEN_VAL"
            fi
          fi
          if [ -z "$SONAR_HOST_URL" ] && [ -n "$CLEAN_JOB_ID" ] && [ "$CLEAN_JOB_ID" != "$PREFIX" ]; then
            JOB_HOST_VAR="${CLEAN_JOB_ID}_SONAR_HOST_URL"
            JOB_HOST_VAL="$(eval "echo \${$JOB_HOST_VAR:-}")"
            if [ -n "$JOB_HOST_VAL" ]; then
              echo "SONAR_HOST_URL=$JOB_HOST_VAL" >> $GITHUB_ENV
              SONAR_HOST_URL="$JOB_HOST_VAL"
            fi
          fi

          SONAR_SOURCES="."
          if [ -d "app" ]; then
            SONAR_SOURCES="app"
          fi
          echo "SONAR_SOURCES=$SONAR_SOURCES" >> $GITHUB_ENV

      
      - name: Run SonarQube / SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN || secrets.SONAR_TOKEN }}
          
        with:
          args: >
            
            
            -Dsonar.projectKey=daas-5ad5d29e-d3c6-4dcf-9521-5d8a75d22f08
            -Dsonar.sources=${{ env.SONAR_SOURCES || '.' }}
            -Dsonar.exclusions=**/*.tf,deployment-output/**,.github/**
            -Dsonar.scm.exclusions.disabled=true
      
      

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME || secrets.ACR_username || secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD || secrets.ACR_password || secrets.REGISTRY_PASSWORD }}

      
      - name: Build backend container image
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/backend:sha-5ad5d29e
          
          
          

      - name: Run Trivy Image Scan for backend (JSON & Summary)
        continue-on-error: true
        run: |
          mkdir -p security-reports
          echo "Executing Trivy container image scan for backend..."
          trivy image --format json --output security-reports/image-backend.json --severity CRITICAL,HIGH,MEDIUM,LOW ${{ env.REGISTRY }}/backend:sha-5ad5d29e || true
          trivy image --severity CRITICAL,HIGH,MEDIUM,LOW ${{ env.REGISTRY }}/backend:sha-5ad5d29e || true
          sudo chmod -R 777 security-reports || true

      - name: Push backend image
        run: |
          docker push ${{ env.REGISTRY }}/backend:sha-5ad5d29e
      
      - name: Build frontend container image
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/frontend:sha-5ad5d29e
          
          
          

      - name: Run Trivy Image Scan for frontend (JSON & Summary)
        continue-on-error: true
        run: |
          mkdir -p security-reports
          echo "Executing Trivy container image scan for frontend..."
          trivy image --format json --output security-reports/image-frontend.json --severity CRITICAL,HIGH,MEDIUM,LOW ${{ env.REGISTRY }}/frontend:sha-5ad5d29e || true
          trivy image --severity CRITICAL,HIGH,MEDIUM,LOW ${{ env.REGISTRY }}/frontend:sha-5ad5d29e || true
          sudo chmod -R 777 security-reports || true

      - name: Push frontend image
        run: |
          docker push ${{ env.REGISTRY }}/frontend:sha-5ad5d29e
      

      - name: Upload Security Reports to Azure Blob Storage
        if: always()
        run: |
          mkdir -p security-reports
          sudo chmod -R 777 security-reports || true
          echo "Uploading security reports to Azure Blob container ${{ env.AZURE_SECURITY_REPORTS_CONTAINER }}/${{ env.JOB_ID }}..."
          if [ -n "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" ]; then
            az storage blob upload-batch               --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}"               --destination "${{ env.AZURE_SECURITY_REPORTS_CONTAINER }}"               --source security-reports/               --destination-path "${{ env.JOB_ID }}"               --overwrite || echo "Warning: Azure storage upload failed, relying on artifact fallback."
          else
            echo "AZURE_STORAGE_CONNECTION_STRING not configured in secrets. Using workflow artifact storage."
          fi

      - name: Upload Security Reports as Workflow Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ env.JOB_ID }}
          path: security-reports/
          retention-days: 30