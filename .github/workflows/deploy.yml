name: Build and Deploy DaaS Package

on:
  push:
    branches: 
        - "networking"
    paths:
        - "deployment-output/**"

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  REGISTRY: azdaasdeployment.azurecr.io
  NAMESPACE: tier3app
  SOURCE_ZIP_URL: "https://daasstorageacct.blob.core.windows.net/deployment-source/7930f155-5bb4-470e-80a3-f9313c7c085a/source.zip?se=2026-09-01T06%3A49%3A47Z&sp=r&sv=2026-06-06&sr=b&sig=wKn/dz2%2Bl64Q1rYjvsd/%2BD4rCT1%2Bah7szM1RDSNCQeU%3D"
  JOB_ID: "7930f155-5bb4-470e-80a3-f9313c7c085a"
  AZURE_SECURITY_REPORTS_CONTAINER: "security-reports"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source artifact
        if: env.SOURCE_ZIP_URL != ''
        run: |
          curl --fail --location --retry 3 "${{ env.SOURCE_ZIP_URL }}" -o source.zip
          mkdir -p app
          unzip -q source.zip -d app

      - name: Install Trivy Scanner
        run: |
          if ! command -v trivy &> /dev/null; then
            echo "Installing Trivy via official apt repository..."
            sudo apt-get install -y wget apt-transport-https gnupg lsb-release
            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
            echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
            sudo apt-get update -y && sudo apt-get install -y trivy || (curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin) || true
          fi
          trivy --version || echo "Trivy installed"

      - name: Run Gitleaks Secret Detection
        run: |
          mkdir -p security-reports
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.18.4 detect             --source="/repo"             --report-path="/repo/security-reports/gitleaks.json"             --report-format=json             --redact             --exit-code=0 || true
          sudo chmod -R 777 security-reports || true

      - name: Run Trivy Filesystem Scan (JSON & Summary)
        continue-on-error: true
        run: |
          mkdir -p security-reports
          echo "Executing Trivy filesystem scan..."
          trivy fs --format json --output security-reports/dependencies.json --severity CRITICAL,HIGH,MEDIUM,LOW . || true
          trivy fs --severity CRITICAL,HIGH,MEDIUM,LOW . || true
          sudo chmod -R 777 security-reports || true

      

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      
      - name: Build backend container image
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/backend:${{ github.sha }}
          
          
          

      - name: Run Trivy Image Scan for backend (JSON & Summary)
        continue-on-error: true
        run: |
          mkdir -p security-reports
          echo "Executing Trivy container image scan for backend..."
          trivy image --format json --output security-reports/image-backend.json --severity CRITICAL,HIGH,MEDIUM,LOW ${{ env.REGISTRY }}/backend:${{ github.sha }} || true
          trivy image --severity CRITICAL,HIGH,MEDIUM,LOW ${{ env.REGISTRY }}/backend:${{ github.sha }} || true
          sudo chmod -R 777 security-reports || true

      - name: Push backend image
        run: |
          docker push ${{ env.REGISTRY }}/backend:${{ github.sha }}
      
      - name: Build frontend container image
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          
          
          

      - name: Run Trivy Image Scan for frontend (JSON & Summary)
        continue-on-error: true
        run: |
          mkdir -p security-reports
          echo "Executing Trivy container image scan for frontend..."
          trivy image --format json --output security-reports/image-frontend.json --severity CRITICAL,HIGH,MEDIUM,LOW ${{ env.REGISTRY }}/frontend:${{ github.sha }} || true
          trivy image --severity CRITICAL,HIGH,MEDIUM,LOW ${{ env.REGISTRY }}/frontend:${{ github.sha }} || true
          sudo chmod -R 777 security-reports || true

      - name: Push frontend image
        run: |
          docker push ${{ env.REGISTRY }}/frontend:${{ github.sha }}
      

      - name: Upload Security Reports to Azure Blob Storage
        if: always()
        run: |
          mkdir -p security-reports
          sudo chmod -R 777 security-reports || true
          echo "Uploading security reports to Azure Blob container security-reports/7930f155-5bb4-470e-80a3-f9313c7c085a..."
          if [ -n "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" ]; then
            az storage blob upload-batch               --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}"               --destination "security-reports/7930f155-5bb4-470e-80a3-f9313c7c085a"               --source security-reports/               --overwrite || echo "Warning: Azure storage upload failed, relying on artifact fallback."
          else
            echo "AZURE_STORAGE_CONNECTION_STRING not configured in secrets. Using workflow artifact storage."
          fi

      - name: Upload Security Reports as Workflow Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-7930f155-5bb4-470e-80a3-f9313c7c085a
          path: security-reports/
          retention-days: 30

  deploy-to-kubernetes:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Resolve Target Cluster & Key Vault
        id: resolve_target
        run: |
          DEPLOY_TARGET_FILE="deployment-output/${{ env.NAMESPACE }}/.deploy-target"
          if [ ! -f "$DEPLOY_TARGET_FILE" ]; then
            echo "Error: No .deploy-target file found at $DEPLOY_TARGET_FILE"
            exit 1
          fi
          CLUSTER_NAME=$(yq e '.cluster_name' $DEPLOY_TARGET_FILE)
          RESOURCE_GROUP=$(yq e '.resource_group' $DEPLOY_TARGET_FILE)
          
          # Dynamically resolve Key Vault associated with resource group
          KEY_VAULT_NAME=$(az keyvault list --resource-group $RESOURCE_GROUP --query "[0].name" -o tsv)
          
          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
          echo "resource_group=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
          echo "key_vault_name=$KEY_VAULT_NAME" >> $GITHUB_OUTPUT
          echo "helm_dir=$(dirname $DEPLOY_TARGET_FILE)/helm" >> $GITHUB_OUTPUT

      - name: Set up Kubeconfig
        run: |
          az aks get-credentials --resource-group ${{ steps.resolve_target.outputs.resource_group }} --name ${{ steps.resolve_target.outputs.cluster_name }} --overwrite-existing


      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Create ACR Pull Secret in AKS
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry acr-pull-secret             --namespace ${{ env.NAMESPACE }}             --docker-server=${{ env.REGISTRY }}             --docker-username=${{ secrets.REGISTRY_USERNAME }}             --docker-password=${{ secrets.REGISTRY_PASSWORD }}             --dry-run=client -o yaml | kubectl apply -f -



      - name: Deploy via Helm
        run: |
          helm upgrade --install tier3app ./${{ steps.resolve_target.outputs.helm_dir }} \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set global.registry=${{ env.REGISTRY }} \
            --set global.deploymentStrategy=rolling \
            --set services.backend.image.tag=${{ github.sha }} \
            --set services.frontend.image.tag=${{ github.sha }} \
            --timeout 5m0s
          # DB credentials are already embedded in the generated Secret manifest
          # (deployment-output/tier3app/helm/templates/database.yaml).
          # Helm applies the Secret as part of the chart — no --set overrides needed.

      - name: Wait for Frontend LoadBalancer IP
        run: |
          echo "Waiting for Frontend LoadBalancer external IP..."
          FRONTEND_SVC="frontend"
          if [ -z "$FRONTEND_SVC" ]; then
            echo "No frontend service found. Skipping LoadBalancer IP wait."
          else
            IP=""
            for i in {1..30}; do
              IP=$(kubectl get svc $FRONTEND_SVC -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
              if [ -z "$IP" ]; then
                IP=$(kubectl get svc $FRONTEND_SVC -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
              fi
              if [ ! -z "$IP" ]; then
                echo "Frontend LoadBalancer IP/Hostname assigned: $IP"
                break
              fi
              echo "Waiting for IP assignment (attempt $i/30)..."
              sleep 10
            done
            if [ -z "$IP" ]; then
              echo "Error: Frontend LoadBalancer IP assignment timed out."
              kubectl describe svc $FRONTEND_SVC -n ${{ env.NAMESPACE }}
              exit 1
            fi
          fi

      - name: Retrieve Public IP & Report URL
        run: |
          echo "Retrieving public IP/hostname from frontend service..."
          FRONTEND_SVC="frontend"
          if [ -z "$FRONTEND_SVC" ]; then
             echo "URL=None" >> $GITHUB_ENV
             echo "### ⚠️ Deployment Completed (No Frontend)" >> $GITHUB_STEP_SUMMARY
             exit 0
          fi
          
          IP=$(kubectl get svc $FRONTEND_SVC -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
          if [ -z "$IP" ]; then
            IP=$(kubectl get svc $FRONTEND_SVC -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          fi
          
          if [ -z "$IP" ]; then
            echo "Warning: Frontend IP/Hostname was not assigned."
            echo "URL=http://<pending-public-ip>" >> $GITHUB_ENV
            echo "### ⚠️ Deployment Completed (IP Pending)" >> $GITHUB_STEP_SUMMARY
          else
            URL="http://$IP"
            echo "URL=$URL" >> $GITHUB_ENV
            echo "### 🚀 Deployment Successfully Exposed!" >> $GITHUB_STEP_SUMMARY
            echo "Your application is publicly reachable at: **[$URL]($URL)**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Save Execution Outputs Directly to Database
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL || secrets.AZURE_POSTGRES_URL }}
          JOB_ID: "7930f155-5bb4-470e-80a3-f9313c7c085a"
          PROVIDER: "azure"
          REGION: "westus"
          NAMESPACE: ${{ env.NAMESPACE }}
          PROJECT_NAME: "tier3app"
          DEPLOYMENT_STRATEGY: "rolling"
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          PUBLIC_URL: ${{ env.URL }}
          INFRA_OUTPUTS_JSON: '{"endpoints": [{"name": "backend", "is_frontend": false, "ports": [8080]},{"name": "frontend", "is_frontend": true, "ports": [80]}]}'
          DB_CONFIG_JSON: '{"POSTGRES_DB": "post_3wdrww", "POSTGRES_PASSWORD": "JitU0h\u0026#3TgZh06xfheucve!", "POSTGRES_USER": "post_f6r0uh"}'
        run: |
          echo "Saving deployment execution outputs directly to database via DATABASE_URL..."
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set. Skipping direct DB update."
            exit 0
          fi

          python3 -m pip install --quiet psycopg2-binary 2>/dev/null || true

          python3 .github/scripts/save_outputs.py

      - name: Cleanup on Failed Deployment
        if: failure()
        run: |
          echo "Deployment failed! Cleaning up resources to avoid inherited failures..."
          helm uninstall tier3app -n ${{ env.NAMESPACE }} || true