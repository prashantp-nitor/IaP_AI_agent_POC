  deploy-to-kubernetes:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Resolve Target Cluster
        id: resolve_target
        run: |
          DEPLOY_TARGET_FILE="deployment-output/${{ env.NAMESPACE }}/.deploy-target"
          if [ ! -f "$DEPLOY_TARGET_FILE" ]; then
            echo "Error: No .deploy-target file found at $DEPLOY_TARGET_FILE"
            exit 1
          fi
          CLUSTER_NAME=$(yq e '.cluster_name' $DEPLOY_TARGET_FILE)
          CLUSTER_REGION=$(yq e '.region' $DEPLOY_TARGET_FILE)

          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
          echo "region=$CLUSTER_REGION" >> $GITHUB_OUTPUT
          echo "helm_dir=$(dirname $DEPLOY_TARGET_FILE)/helm" >> $GITHUB_OUTPUT

      - name: Set up Kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ steps.resolve_target.outputs.cluster_name }} --region ${{ steps.resolve_target.outputs.region }}

      - name: Verify cluster access
        run: |
          if ! kubectl auth can-i create deployments -n ${{ env.NAMESPACE }} >/dev/null 2>&1; then
            echo "::error::CI principal cannot create workloads in the EKS cluster. Grant it an EKS access entry:"
            echo "  aws eks create-access-entry --cluster-name ${{ steps.resolve_target.outputs.cluster_name }} --region ${{ steps.resolve_target.outputs.region }} --principal-arn <CI_PRINCIPAL_ARN>"
            echo "  aws eks associate-access-policy --cluster-name ${{ steps.resolve_target.outputs.cluster_name }} --region ${{ steps.resolve_target.outputs.region }} --principal-arn <CI_PRINCIPAL_ARN> --access-scope type=cluster --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSEditPolicy"
            exit 1
          fi


      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Create ECR Pull Secret in EKS
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry regcred \
            --namespace ${{ env.NAMESPACE }} \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=AWS \
            --docker-password=$(aws ecr get-login-password --region ${{ steps.resolve_target.outputs.region }}) \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Install metrics-server
        run: |
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo update
          helm upgrade --install metrics-server metrics-server/metrics-server \
            --namespace kube-system \
            --set args[0]="--kubelet-insecure-tls" \
            --wait --timeout 3m0s

      - name: Create StorageClass gp3
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: gp3
          provisioner: ebs.csi.aws.com
          volumeBindingMode: WaitForFirstConsumer
          allowVolumeExpansion: true
          parameters:
            type: gp3
          EOF

      - name: Deploy via Helm
        run: |
          helm upgrade --install boutique-app-v1 ./${{ steps.resolve_target.outputs.helm_dir }} \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set global.registry=${{ env.REGISTRY }} \
            --set global.deploymentStrategy=rolling \
            --set services.frontend.image.tag=${{ github.sha }} \
            --set services.adservice.image.tag=${{ github.sha }} \
            --set services.redis-cart.image.tag=${{ github.sha }} \
            --set services.cartservice.image.tag=${{ github.sha }} \
            --set services.emailservice.image.tag=${{ github.sha }} \
            --set services.loadgenerator.image.tag=${{ github.sha }} \
            --set services.paymentservice.image.tag=${{ github.sha }} \
            --set services.checkoutservice.image.tag=${{ github.sha }} \
            --set services.currencyservice.image.tag=${{ github.sha }} \
            --set services.shippingservice.image.tag=${{ github.sha }} \
            --set services.productcatalogservice.image.tag=${{ github.sha }} \
            --set services.recommendationservice.image.tag=${{ github.sha }} \
            --set services.shoppingassistantservice.image.tag=${{ github.sha }} \
            --timeout 5m0s
          # DB credentials are already embedded in the generated Secret manifest
          # (deployment-output/boutique-app-v1/helm/templates/database.yaml).
          # Helm applies the Secret as part of the chart — no --set overrides needed.

      - name: Wait for Frontend LoadBalancer IP
        run: |
          echo "Waiting for Frontend LoadBalancer external IP..."
          FRONTEND_SVC="frontend"
          if [ -z "$FRONTEND_SVC" ]; then
            echo "No frontend service found. Skipping LoadBalancer IP wait."
          else
            IP=""
            for i in {1..30}; do
              IP=$(kubectl get svc $FRONTEND_SVC -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
              if [ -z "$IP" ]; then
                IP=$(kubectl get svc $FRONTEND_SVC -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
              fi
              if [ ! -z "$IP" ]; then
                echo "Frontend LoadBalancer IP/Hostname assigned: $IP"
                break
              fi
              echo "Waiting for IP assignment (attempt $i/30)..."
              sleep 10
            done
            if [ -z "$IP" ]; then
              echo "Error: Frontend LoadBalancer IP assignment timed out."
              kubectl describe svc $FRONTEND_SVC -n ${{ env.NAMESPACE }}
              exit 1
            fi
          fi

      - name: Retrieve Public IP & Report URL
        run: |
          echo "Retrieving public IP/hostname from frontend service..."
          FRONTEND_SVC="frontend"
          if [ -z "$FRONTEND_SVC" ]; then
             echo "URL=None" >> $GITHUB_ENV
             echo "### ⚠️ Deployment Completed (No Frontend)" >> $GITHUB_STEP_SUMMARY
             exit 0
          fi
          
          IP=$(kubectl get svc $FRONTEND_SVC -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
          if [ -z "$IP" ]; then
            IP=$(kubectl get svc $FRONTEND_SVC -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          fi
          
          if [ -z "$IP" ]; then
            echo "Warning: Frontend IP/Hostname was not assigned."
            echo "URL=http://<pending-public-ip>" >> $GITHUB_ENV
            echo "### ⚠️ Deployment Completed (IP Pending)" >> $GITHUB_STEP_SUMMARY
          else
            URL="http://$IP"
            echo "URL=$URL" >> $GITHUB_ENV
            echo "### 🚀 Deployment Successfully Exposed!" >> $GITHUB_STEP_SUMMARY
            echo "Your application is publicly reachable at: **[$URL]($URL)**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup on Failed Deployment
        if: failure()
        run: |
          echo "Deployment failed! Cleaning up resources to avoid inherited failures..."
          helm uninstall boutique-app-v1 -n ${{ env.NAMESPACE }} || true