name: Build and Deploy DaaS Package

on:
  push:
    branches: 
        - "main"
    paths:
        - "deployment-output/**"

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: azdaasdeployment.azurecr.io
  NAMESPACE: trivy-fitcart
  SOURCE_ZIP_URL: "https://hfxfwdthcbetvpwqgzbr.supabase.co/storage/v1/object/sign/deployment-source/b2b5281c-381f-439b-bba1-50924e09e38a/source.zip?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV9mNjgzZTM4Ni0yNTc3LTQ4ODYtYmNmYi1jZTdkYzBjYWRjNjIiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJkZXBsb3ltZW50LXNvdXJjZS9iMmI1MjgxYy0zODFmLTQzOWItYmJhMS01MDkyNGUwOWUzOGEvc291cmNlLnppcCIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3ODUzNDcwMTgsImV4cCI6MTc4NTM1MDYxOH0.PKQp4LPl_ZyA42MyHhAPnYpAYutwh7LCUcE25sbJinI"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download source artifact
        run: |
          curl --fail --location --retry 3 "${{ env.SOURCE_ZIP_URL }}" -o source.zip

      - name: Extract source
        run: |
          mkdir app
          unzip -q source.zip -d app

      - name: Scan source for secrets (gitleaks)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/app:/scan" \
            zricethezav/gitleaks:v8.18.4 \
            detect --source=/scan --no-git --redact --verbose --exit-code=1

      - name: Scan dependencies for vulnerabilities (trivy)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/trivy-reports"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            aquasec/trivy:0.55.0 \
            fs /workspace/app --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --no-progress \
            --format template --template "@/contrib/html.tpl" \
            --output /workspace/trivy-reports/dependencies.html --exit-code 0

      - name: SonarQube SAST scan (report only)
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.SONAR_HOST_URL }}" ]; then
            echo "SONAR_HOST_URL not configured — skipping SonarQube scan."
            exit 0
          fi
          docker run --rm \
            -e SONAR_HOST_URL="${{ secrets.SONAR_HOST_URL }}" \
            -e SONAR_TOKEN="${{ secrets.SONAR_TOKEN }}" \
            -v "$GITHUB_WORKSPACE/app:/usr/src" \
            sonarsource/sonar-scanner-cli:11 \
            -Dsonar.projectKey=trivy-fitcart \
            -Dsonar.sources=. \
            -Dsonar.qualitygate.wait=false

      - name: Cache OWASP Dependency-Check NVD data
        uses: actions/cache@v4
        with:
          path: dependency-check-data
          key: dependency-check-data-${{ runner.os }}

      - name: Scan dependencies with OWASP Dependency-Check (report only)
        continue-on-error: true
        run: |
          mkdir -p "$GITHUB_WORKSPACE/owasp-reports" "$GITHUB_WORKSPACE/dependency-check-data"
          docker run --rm \
            -u $(id -u):$(id -g) \
            -v "$GITHUB_WORKSPACE/app:/src" \
            -v "$GITHUB_WORKSPACE/dependency-check-data:/usr/share/dependency-check/data" \
            -v "$GITHUB_WORKSPACE/owasp-reports:/report" \
            owasp/dependency-check:10.0.4 \
            --scan /src \
            --project "trivy-fitcart" \
            --format HTML --format JSON \
            --out /report \
            --failOnCVSS 11 \
            ${{ secrets.NVD_API_KEY != '' && format('--nvdApiKey {0}', secrets.NVD_API_KEY) || '' }}

      - name: Upload OWASP Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: owasp-reports/
          if-no-files-found: ignore

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/backend:${{ github.sha }}
          
          
          

      - name: Scan backend image for vulnerabilities (trivy)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/trivy-reports"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:/workspace" \
            aquasec/trivy:0.55.0 \
            image ${{ env.REGISTRY }}/backend:${{ github.sha }} --severity CRITICAL,HIGH --ignore-unfixed --no-progress \
            --format template --template "@/contrib/html.tpl" \
            --output /workspace/trivy-reports/image-backend.html --exit-code 0

      - name: Push backend image
        run: |
          docker push ${{ env.REGISTRY }}/backend:${{ github.sha }}
      
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          
          
          

      - name: Scan frontend image for vulnerabilities (trivy)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/trivy-reports"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:/workspace" \
            aquasec/trivy:0.55.0 \
            image ${{ env.REGISTRY }}/frontend:${{ github.sha }} --severity CRITICAL,HIGH --ignore-unfixed --no-progress \
            --format template --template "@/contrib/html.tpl" \
            --output /workspace/trivy-reports/image-frontend.html --exit-code 0

      - name: Push frontend image
        run: |
          docker push ${{ env.REGISTRY }}/frontend:${{ github.sha }}
      

      - name: Upload Trivy vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-reports/
          if-no-files-found: ignore

  deploy-to-kubernetes:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Resolve Target Cluster & Key Vault
        id: resolve_target
        run: |
          DEPLOY_TARGET_FILE="deployment-output/${{ env.NAMESPACE }}/.deploy-target"
          if [ ! -f "$DEPLOY_TARGET_FILE" ]; then
            echo "Error: No .deploy-target file found at $DEPLOY_TARGET_FILE"
            exit 1
          fi
          CLUSTER_NAME=$(yq e '.cluster_name' $DEPLOY_TARGET_FILE)
          RESOURCE_GROUP=$(yq e '.resource_group' $DEPLOY_TARGET_FILE)
          
          # Dynamically resolve Key Vault associated with resource group
          KEY_VAULT_NAME=$(az keyvault list --resource-group $RESOURCE_GROUP --query "[0].name" -o tsv)
          
          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
          echo "resource_group=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
          echo "key_vault_name=$KEY_VAULT_NAME" >> $GITHUB_OUTPUT
          echo "helm_dir=$(dirname $DEPLOY_TARGET_FILE)/helm" >> $GITHUB_OUTPUT

      - name: Set up Kubeconfig
        run: |
          az aks get-credentials --resource-group ${{ steps.resolve_target.outputs.resource_group }} --name ${{ steps.resolve_target.outputs.cluster_name }} --overwrite-existing


      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Create ACR Pull Secret in AKS
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry acr-pull-secret             --namespace ${{ env.NAMESPACE }}             --docker-server=${{ env.REGISTRY }}             --docker-username=${{ secrets.REGISTRY_USERNAME }}             --docker-password=${{ secrets.REGISTRY_PASSWORD }}             --dry-run=client -o yaml | kubectl apply -f -



      - name: Deploy via Helm
        run: |
          helm upgrade --install trivy-fitcart ./${{ steps.resolve_target.outputs.helm_dir }} \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set global.registry=${{ env.REGISTRY }} \
            --set global.deploymentStrategy=rolling \
            --set services.backend.image.tag=${{ github.sha }} \
            --set services.frontend.image.tag=${{ github.sha }} \
            --timeout 5m0s
          # DB credentials are already embedded in the generated Secret manifest
          # (deployment-output/trivy-fitcart/helm/templates/database.yaml).
          # Helm applies the Secret as part of the chart — no --set overrides needed.

      - name: Wait for Frontend LoadBalancer IP
        run: |
          echo "Waiting for Frontend LoadBalancer external IP..."
          FRONTEND_SVC="frontend"
          if [ -z "$FRONTEND_SVC" ]; then
            echo "No frontend service found. Skipping LoadBalancer IP wait."
          else
            IP=""
            for i in {1..30}; do
              IP=$(kubectl get svc $FRONTEND_SVC -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
              if [ -z "$IP" ]; then
                IP=$(kubectl get svc $FRONTEND_SVC -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
              fi
              if [ ! -z "$IP" ]; then
                echo "Frontend LoadBalancer IP/Hostname assigned: $IP"
                break
              fi
              echo "Waiting for IP assignment (attempt $i/30)..."
              sleep 10
            done
            if [ -z "$IP" ]; then
              echo "Error: Frontend LoadBalancer IP assignment timed out."
              kubectl describe svc $FRONTEND_SVC -n ${{ env.NAMESPACE }}
              exit 1
            fi
          fi

      - name: Retrieve Public IP & Report URL
        run: |
          echo "Retrieving public IP/hostname from frontend service..."
          FRONTEND_SVC="frontend"
          if [ -z "$FRONTEND_SVC" ]; then
             echo "URL=None" >> $GITHUB_ENV
             echo "### ⚠️ Deployment Completed (No Frontend)" >> $GITHUB_STEP_SUMMARY
             exit 0
          fi
          
          IP=$(kubectl get svc $FRONTEND_SVC -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
          if [ -z "$IP" ]; then
            IP=$(kubectl get svc $FRONTEND_SVC -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          fi
          
          if [ -z "$IP" ]; then
            echo "Warning: Frontend IP/Hostname was not assigned."
            echo "URL=http://<pending-public-ip>" >> $GITHUB_ENV
            echo "### ⚠️ Deployment Completed (IP Pending)" >> $GITHUB_STEP_SUMMARY
          else
            URL="http://$IP"
            echo "URL=$URL" >> $GITHUB_ENV
            echo "### 🚀 Deployment Successfully Exposed!" >> $GITHUB_STEP_SUMMARY
            echo "Your application is publicly reachable at: **[$URL]($URL)**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup on Failed Deployment
        if: failure()
        run: |
          echo "Deployment failed! Cleaning up resources to avoid inherited failures..."
          helm uninstall trivy-fitcart -n ${{ env.NAMESPACE }} || true