name: Build and Deploy DaaS Package

on:
  push:
    branches: 
        - "main"
    paths:
        - "deployment-output/**"

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: daasdeployment.azurecr.io
  NAMESPACE: test-rg
  SOURCE_ZIP_URL: "https://hfxfwdthcbetvpwqgzbr.supabase.co/storage/v1/object/sign/deployment-source/b58f2dd1-f2c7-41a7-a723-5626f62ffb8d/source.zip?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV9mNjgzZTM4Ni0yNTc3LTQ4ODYtYmNmYi1jZTdkYzBjYWRjNjIiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJkZXBsb3ltZW50LXNvdXJjZS9iNThmMmRkMS1mMmM3LTQxYTctYTcyMy01NjI2ZjYyZmZiOGQvc291cmNlLnppcCIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3ODIyODUzMzAsImV4cCI6MTc4MjI4ODkzMH0.oc1nHVAQkdZBB-FiKrxSWBNuaIM7RyAIndHPQFJe4hE"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download source artifact
        run: |
          curl --fail --location --retry 3 "${{ env.SOURCE_ZIP_URL }}" -o source.zip

      - name: Extract source
        run: |
          mkdir app
          unzip -q source.zip -d app

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      
      - name: Build and Push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/backend:${{ github.sha }}
          
          
          
      
      - name: Build and Push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          
          
          
      

  deploy-to-kubernetes:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Resolve Target Cluster & Key Vault
        id: resolve_target
        run: |
          DEPLOY_TARGET_FILE="deployment-output/${{ env.NAMESPACE }}/.deploy-target"
          if [ ! -f "$DEPLOY_TARGET_FILE" ]; then
            echo "Error: No .deploy-target file found at $DEPLOY_TARGET_FILE"
            exit 1
          fi
          CLUSTER_NAME=$(yq e '.cluster_name' $DEPLOY_TARGET_FILE)
          RESOURCE_GROUP=$(yq e '.resource_group' $DEPLOY_TARGET_FILE)
          
          # Dynamically resolve Key Vault associated with resource group
          KEY_VAULT_NAME=$(az keyvault list --resource-group $RESOURCE_GROUP --query "[0].name" -o tsv)
          
          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
          echo "resource_group=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
          echo "key_vault_name=$KEY_VAULT_NAME" >> $GITHUB_OUTPUT
          echo "helm_dir=$(dirname $DEPLOY_TARGET_FILE)/helm" >> $GITHUB_OUTPUT

      - name: Set up Kubeconfig
        run: |
          az aks get-credentials --resource-group ${{ steps.resolve_target.outputs.resource_group }} --name ${{ steps.resolve_target.outputs.cluster_name }} --overwrite-existing


      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Install NGINX Ingress Controller
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx --namespace ingress-nginx --create-namespace --set controller.service.externalTrafficPolicy=Local --timeout 10m0s

      - name: Wait for NGINX Ingress LoadBalancer IP
        run: |
          echo "Waiting for NGINX Ingress Controller LoadBalancer external IP..."
          INGRESS_IP=""
          for i in {1..30}; do
            INGRESS_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            if [ -z "$INGRESS_IP" ]; then
              INGRESS_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            fi
            if [ ! -z "$INGRESS_IP" ]; then
              echo "NGINX Ingress LoadBalancer IP/Hostname assigned: $INGRESS_IP"
              break
            fi
            echo "Waiting for IP assignment (attempt $i/30)..."
            sleep 10
          done
          if [ -z "$INGRESS_IP" ]; then
            echo "Error: Ingress Controller IP assignment timed out."
            echo "=== Ingress Controller Service Diagnostics ==="
            kubectl describe svc ingress-nginx-controller -n ingress-nginx
            echo "=== Ingress Controller Pods Diagnostics ==="
            kubectl get pods -n ingress-nginx
            kubectl describe pods -n ingress-nginx -l app.kubernetes.io/name=ingress-nginx
            exit 1
          fi

      - name: Create ACR Pull Secret in AKS
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry acr-pull-secret             --namespace ${{ env.NAMESPACE }}             --docker-server=${{ env.REGISTRY }}             --docker-username=${{ secrets.REGISTRY_USERNAME }}             --docker-password=${{ secrets.REGISTRY_PASSWORD }}             --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy via Helm
        run: |
          helm upgrade --install test-rg ./${{ steps.resolve_target.outputs.helm_dir }} \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set global.registry=${{ env.REGISTRY }} \
            --set global.deploymentStrategy=rolling \
            --set services.backend.image.tag=${{ github.sha }} \
            --set services.frontend.image.tag=${{ github.sha }} \
            --timeout 5m0s
          # DB credentials are already embedded in the generated Secret manifest
          # (deployment-output/test-rg/helm/templates/database.yaml).
          # Helm applies the Secret as part of the chart — no --set overrides needed.

      - name: Retrieve Ingress Public IP & Report URL
        run: |
          echo "Retrieving Ingress public IP/hostname from NGINX controller..."
          IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
          if [ -z "$IP" ]; then
            IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          fi
          
          echo "=== Ingress Controller Status ==="
          kubectl get svc ingress-nginx-controller -n ingress-nginx
          echo "=== Application Ingress Status ==="
          kubectl get ingress -n ${{ env.NAMESPACE }}
          echo "=== Services Status ==="
          kubectl get svc -n ${{ env.NAMESPACE }}

          if [ -z "$IP" ]; then
            echo "Warning: Ingress IP/Hostname was not assigned."
            echo "URL=http://<pending-public-ip>" >> $GITHUB_ENV
            echo "### ⚠️ Deployment Completed (Ingress Pending)" >> $GITHUB_STEP_SUMMARY
            echo "The application was deployed successfully, but the public IP/hostname allocation is still in progress." >> $GITHUB_STEP_SUMMARY
          else
            URL="http://$IP"
            echo "URL=$URL" >> $GITHUB_ENV
            echo "### 🚀 Deployment Successfully Exposed!" >> $GITHUB_STEP_SUMMARY
            echo "Your application is publicly reachable at: **[$URL]($URL)**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Resource | Name | Status | URL |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
            echo "| Ingress | test-rg-ingress | Exposed | [$URL]($URL) |" >> $GITHUB_STEP_SUMMARY
            echo "| Path Routing | &#96;/api&#96; → Backend | Active | [$URL/api]($URL/api) |" >> $GITHUB_STEP_SUMMARY
            echo "| Path Routing | &#96;/&#96; → Frontend | Active | [$URL]($URL) |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "*(Note: It might take a few moments for the Ingress Controller to fully propagate the routing rules)*" >> $GITHUB_STEP_SUMMARY
          fi