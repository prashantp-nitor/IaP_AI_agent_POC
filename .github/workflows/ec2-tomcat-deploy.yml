name: Enterprise Tomcat Deployment
 
on:
  push:
    branches:
      - main
    paths:
      - "ec2-deployment-output/**"
 
  workflow_dispatch:
 
permissions:
  contents: read
 
env:
  SOURCE_ZIP_URL: "https://hfxfwdthcbetvpwqgzbr.supabase.co/storage/v1/object/sign/deployment-source/0034fa6e-33fd-4246-bf72-9ffd511cb0c9/source.zip?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV9mNjgzZTM4Ni0yNTc3LTQ4ODYtYmNmYi1jZTdkYzBjYWRjNjIiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJkZXBsb3ltZW50LXNvdXJjZS8wMDM0ZmE2ZS0zM2ZkLTQyNDYtYmY3Mi05ZmZkNTExY2IwYzkvc291cmNlLnppcCIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3ODQxOTM4OTQsImV4cCI6MTc4NDE5NzQ5NH0.JGrAHMgFhVHFYFCIopjQEsSi05t_-4B4h8uBLrwqC9c"
 
jobs:
 
  deploy:
 
    runs-on: ubuntu-latest
 
    steps:
 
      #######################################################
      # Checkout Repository
      #######################################################
 
      - name: Checkout Repository
        uses: actions/checkout@v4
 
      #######################################################
      # Install yq
      #######################################################
 
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
          https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
 
          sudo chmod +x /usr/local/bin/yq
 
      #######################################################
      # Read Deployment Metadata
      #######################################################
 
      - name: Read Deployment Metadata
        id: target
 
        run: |
 
          TARGET=$(find ec2-deployment-output \
          -name ".deploy-target" \
          | head -1)
 
          if [ ! -f "$TARGET" ]; then
            echo "Deployment target not found"
            exit 1
          fi
          
          # Extract available fields from .deploy-target
          HOST=$(yq '.ec2_host' $TARGET)
          if [ "$HOST" == "null" ] || [ -z "$HOST" ]; then
            echo "::error::ec2_host not found in .deploy-target"
            exit 1
          fi
          echo "host=$HOST" >> $GITHUB_OUTPUT
          echo "region=$(yq '.region' $TARGET)" >> $GITHUB_OUTPUT
          echo "instance=$(yq '.cluster_name' $TARGET)" >> $GITHUB_OUTPUT
 
          # Fallback / hardcoded configuration for DaaS project defaults
          echo "app=myapp" >> $GITHUB_OUTPUT
          echo "context=myapp" >> $GITHUB_OUTPUT
          echo "java=17" >> $GITHUB_OUTPUT
          echo "tomcat=/opt/tomcat" >> $GITHUB_OUTPUT
          echo "service=tomcat" >> $GITHUB_OUTPUT
          echo "health=/myapp" >> $GITHUB_OUTPUT
 
      #######################################################
      # Download Source
      #######################################################
 
      - name: Download Source
 
        run: |
 
          curl \
          --fail \
          --location \
          --retry 3 \
          "$SOURCE_ZIP_URL" \
          -o source.zip
 
          mkdir source
 
          unzip -q source.zip -d source
 
      #######################################################
      # Detect Project
      #######################################################
 
      - name: Detect Maven Project
        id: project
 
        run: |
 
          PROJECT=$(find source \
          -name pom.xml \
          -exec dirname {} \; \
          | head -1)
 
          if [ -z "$PROJECT" ]; then
            echo "pom.xml not found"
            exit 1
          fi
 
          echo "project=$PROJECT" >> $GITHUB_OUTPUT
 
          echo "Project : $PROJECT"
 
      #######################################################
      # Setup Java
      #######################################################
 
      - name: Setup Java
 
        uses: actions/setup-java@v4
 
        with:
 
          distribution: temurin
 
          java-version: ${{ steps.target.outputs.java }}
 
          cache: maven
 
      #######################################################
      # Build WAR
      #######################################################
 
      - name: Build Application
 
        working-directory: ${{ steps.project.outputs.project }}
 
        run: mvn clean package -DskipTests
 
      #######################################################
      # Locate WAR
      #######################################################
 
      - name: Locate WAR
        id: artifact
 
        working-directory: ${{ steps.project.outputs.project }}
 
        run: |
 
          WAR=$(find target \
          -name "*.war" \
          | head -1)
 
          if [ -z "$WAR" ]; then
            echo "WAR not found"
            exit 1
          fi
 
          jar tf "$WAR" >/dev/null
 
          mkdir deploy
 
          cp "$WAR" deploy/
 
          WAR_NAME=$(basename "$WAR")
 
          echo "war=deploy/$WAR_NAME" >> $GITHUB_OUTPUT
 
          sha256sum deploy/$WAR_NAME > deploy/$WAR_NAME.sha256
 
      #######################################################
      # Debug SSH Parameters
      #######################################################
 
      - name: Debug SSH Parameters
        run: |
          echo "Debugging SSH Connection Details:"
          echo "Target Host: ${{ steps.target.outputs.host }}"
          echo "Target Username: ${{ secrets.EC2_USER }}"
          echo "If the Host is empty, the .deploy-target file didn't contain it."
          echo "If the Username is empty, the EC2_USER secret is missing from GitHub."
          echo "Note: The private key cannot be printed for security reasons."

      #######################################################
      # Download external Tomcat install script
      #######################################################

      - name: Download Tomcat Install Script
        run: |
          # -f flag ensures curl fails if the file is not found (e.g., 404)
          # Using the GitHub API is more reliable for private repos and automatically targets the default branch (main/master)
          curl -f -L \
            -H "Authorization: token ${{ secrets.POC_REPO_PAT }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -o install_tomcat.sh \
            https://api.github.com/repos/prashantp-nitor/IaP_AI_agent_POC/contents/install_tomcat.sh

      #######################################################
      # Upload WAR
      #######################################################
 
      - name: Upload WAR and Setup Script
 
        uses: appleboy/scp-action@v1
 
        with:
 
          host: ${{ steps.target.outputs.host }}
 
          username: ${{ secrets.EC2_USER }}
 
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
 
          source: "${{ steps.project.outputs.project }}/deploy/*,install_tomcat.sh"
 
          target: /tmp/deployment
 
      #######################################################
      # Deploy
      #######################################################
 
      - name: Execute Deployment
 
        uses: appleboy/ssh-action@v1
 
        with:
 
          host: ${{ steps.target.outputs.host }}
 
          username: ${{ secrets.EC2_USER }}
 
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
 
          script: |
            set -e

            echo "=========================================="
            echo " DaaS EC2 Tomcat Deployment - $(date)"
            echo "=========================================="

            echo "Installing/Updating Tomcat..."
            chmod +x /tmp/deployment/install_tomcat.sh
            sudo bash /tmp/deployment/install_tomcat.sh

            echo "Finding uploaded WAR file..."
            WAR_FILE=$(find /tmp/deployment -name "*.war" 2>/dev/null | head -1)

            if [ -z "$WAR_FILE" ]; then
              echo "::error::WAR file not found in /tmp/deployment/"
              exit 1
            fi

            echo "WAR file found: $WAR_FILE"

            echo "Stopping Tomcat..."
            sudo systemctl stop ${{ steps.target.outputs.service }}

            echo "Removing previous deployment..."
            sudo rm -rf ${{ steps.target.outputs.tomcat }}/webapps/${{ steps.target.outputs.context }}
            sudo rm -f ${{ steps.target.outputs.tomcat }}/webapps/${{ steps.target.outputs.context }}.war

            echo "Deploying new WAR..."
            sudo cp "$WAR_FILE" ${{ steps.target.outputs.tomcat }}/webapps/${{ steps.target.outputs.context }}.war
            sudo chown tomcat:tomcat ${{ steps.target.outputs.tomcat }}/webapps/${{ steps.target.outputs.context }}.war

            echo "Starting Tomcat..."
            sudo systemctl start ${{ steps.target.outputs.service }}

            echo "Checking Tomcat status..."
            sudo systemctl status ${{ steps.target.outputs.service }} --no-pager

            echo ""
            echo "Deployment completed successfully"

      #######################################################
      # Health Check
      #######################################################

      - name: Health check
        run: |
          echo "Waiting for Tomcat to come up..."
          sleep 15
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://${{ steps.target.outputs.host }}:8080${{ steps.target.outputs.health }}" || echo "000")
            if [ "$STATUS" == "200" ] || [ "$STATUS" == "302" ]; then
              echo "✅ Application is reachable (HTTP $STATUS)"
              break
            fi
            echo "Attempt $i/10: HTTP $STATUS - retrying in 10s..."
            sleep 10
            if [ $i -eq 10 ]; then
              echo "::error::Health check failed after 10 attempts. Last HTTP status: $STATUS"
              exit 1
            fi
          done
 
      #######################################################
      # GitHub Summary
      #######################################################
 
      - name: Deployment Summary
 
        if: success()
 
        run: |
 
          echo "# Deployment Successful" >> $GITHUB_STEP_SUMMARY
 
          echo "" >> $GITHUB_STEP_SUMMARY
 
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Application | http://${{ steps.target.outputs.host }}:8080${{ steps.target.outputs.context }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Host | ${{ steps.target.outputs.host }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Region | ${{ steps.target.outputs.region }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | SUCCESS |" >> $GITHUB_STEP_SUMMARY
 
      #######################################################
      # Rollback
      #######################################################
 
      - name: Rollback
 
        if: failure()
 
        uses: appleboy/ssh-action@v1
 
        with:
 
          host: ${{ steps.target.outputs.host }}
 
          username: ${{ secrets.EC2_USER }}
 
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
 
          script: |
            echo "::warning::Deployment failed - attempting Tomcat rollback..."
            sudo systemctl restart ${{ steps.target.outputs.service }} || true
            sudo systemctl status ${{ steps.target.outputs.service }} --no-pager || true
            echo "Rollback attempted. Manual intervention may be required."