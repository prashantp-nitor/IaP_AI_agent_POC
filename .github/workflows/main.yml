name: Terraform Infra Deployment Pipeline

on:
  workflow_dispatch: {}
  push:
    branches:
      - networking
    paths:
      - 'iaap-output/**'
      - '!iaap-output/*-vpc/**'
      - '!iaap-output/*-vnet/**'

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.8.0

jobs:

  detect-changes:
    name: Detect Changed Directories
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.set-matrix.outputs.directories }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed iaap-output subdirectories
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run: find every directory containing .tf files under iaap-output/
            # Supports both flat (iaap-output/<resource>/) and nested
            # (iaap-output/<project>/<resource>/) project structures.
            DIRS=$(find iaap-output -name "*.tf" -exec dirname {} \; 2>/dev/null \
              | sed 's|^iaap-output/||' \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            # Push run: detect changed paths and derive the containing TF directory.
            # awk rules:
            #   NF==2 → flat:   iaap-output/<resource>/file  → print <resource>
            #   NF==3 → nested: iaap-output/<project>/<resource>/file → print <project>/<resource>
            DIRS=$(git diff --name-only HEAD~1 HEAD \
              | grep '^iaap-output/' \
              | sed 's|^iaap-output/||' \
              | awk -F/ 'NF==2{print $1} NF>=3{print $1"/"$2}' \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "directories=$DIRS" >> $GITHUB_OUTPUT
          echo "Detected directories: $DIRS"

  terraform-plan:
    name: Terraform Plan - ${{ matrix.directory }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.directories != '[]' }}

    strategy:
      matrix:
        directory: ${{ fromJson(needs.detect-changes.outputs.directories) }}
      fail-fast: false

    defaults:
      run:
        # matrix.directory is either "<resource>" (flat) or "<project>/<resource>" (nested)
        working-directory: iaap-output/${{ matrix.directory }}

    # Credentials for ALL providers are exported; Terraform only consumes the set
    # that matches the provider declared in the changed directory. The conditional
    # login steps below activate the matching cloud CLI.
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
      GOOGLE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect cloud provider
        id: provider
        run: |
          if grep -rqiE 'hashicorp/aws|provider "aws"' --include='*.tf' .; then
            P=aws
          elif grep -rqiE 'hashicorp/google|provider "google"' --include='*.tf' .; then
            P=gcp
          elif grep -rqiE 'hashicorp/azurerm|provider "azurerm"' --include='*.tf' .; then
            P=azure
          else
            echo "::error::Could not determine cloud provider for ${{ matrix.directory }}"
            exit 1
          fi
          echo "provider=$P" >> "$GITHUB_OUTPUT"
          echo "Detected provider for ${{ matrix.directory }}: $P"

      - name: Azure login
        if: steps.provider.outputs.provider == 'azure'
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure AWS credentials
        if: steps.provider.outputs.provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Authenticate to Google Cloud
        if: steps.provider.outputs.provider == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        env:
          ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}
        run: |
          # Derive tfstate key: nested paths (project/resource) share a
          # project-level state; flat paths keep their own key.
          MATRIX_DIR="${{ matrix.directory }}"
          if echo "$MATRIX_DIR" | grep -q '/'; then
            TFSTATE_KEY="$(echo "$MATRIX_DIR" | cut -d'/' -f1)/terraform.tfstate"
          else
            TFSTATE_KEY="${MATRIX_DIR}/terraform.tfstate"
          fi
          terraform init \
            -backend-config="resource_group_name=${{ secrets.AZURE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=deploy-storage" \
            -backend-config="key=${TFSTATE_KEY}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.directory }}
          path: iaap-output/${{ matrix.directory }}/tfplan

  terraform-apply:
    name: Terraform Apply - ${{ matrix.directory }}
    runs-on: ubuntu-latest
    needs: [detect-changes, terraform-plan]

    environment:
      name: dev

    strategy:
      matrix:
        directory: ${{ fromJson(needs.detect-changes.outputs.directories) }}
      fail-fast: false

    defaults:
      run:
        # matrix.directory is either "<resource>" (flat) or "<project>/<resource>" (nested)
        working-directory: iaap-output/${{ matrix.directory }}

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
      GOOGLE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      TF_VAR_db_password: ${{ secrets.RDS_DB_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect cloud provider
        id: provider
        run: |
          if grep -rqiE 'hashicorp/aws|provider "aws"' --include='*.tf' .; then
            P=aws
          elif grep -rqiE 'hashicorp/google|provider "google"' --include='*.tf' .; then
            P=gcp
          elif grep -rqiE 'hashicorp/azurerm|provider "azurerm"' --include='*.tf' .; then
            P=azure
          else
            echo "::error::Could not determine cloud provider for ${{ matrix.directory }}"
            exit 1
          fi
          echo "provider=$P" >> "$GITHUB_OUTPUT"
          echo "Detected provider for ${{ matrix.directory }}: $P"

      - name: Azure login
        if: steps.provider.outputs.provider == 'azure'
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure AWS credentials
        if: steps.provider.outputs.provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          
      - name: Check AWS Identity
        if: steps.provider.outputs.provider == 'aws'
        run: |
         aws sts get-caller-identity

      - name: Authenticate to Google Cloud
        if: steps.provider.outputs.provider == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.directory }}
          path: iaap-output/${{ matrix.directory }}

      - name: Terraform Init
        run: |
          # Derive tfstate key: nested paths (project/resource) share a
          # project-level state; flat paths keep their own key.
          MATRIX_DIR="${{ matrix.directory }}"
          if echo "$MATRIX_DIR" | grep -q '/'; then
            TFSTATE_KEY="$(echo "$MATRIX_DIR" | cut -d'/' -f1)/terraform.tfstate"
          else
            TFSTATE_KEY="${MATRIX_DIR}/terraform.tfstate"
          fi
          terraform init \
            -backend-config="container_name=deploy-storage" \
            -backend-config="key=${TFSTATE_KEY}" \
            -backend-config="connection_string=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}"

      - name: Terraform Apply
        id: tf_apply
        run: |
          set +e
          terraform apply -auto-approve tfplan 2>&1 | tee apply.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Clear Terraform Lock on Failure
        if: failure()
        run: |
          if [ -f apply.log ]; then
            LOCK_ID=$(grep -oE "ID:\s+[0-9a-fA-F-]+" apply.log | awk '{print $2}')
            if [ ! -z "$LOCK_ID" ]; then
              echo "Deploy failed. Clearing Terraform lock: $LOCK_ID"
              terraform force-unlock -force "$LOCK_ID"
            fi
          fi
