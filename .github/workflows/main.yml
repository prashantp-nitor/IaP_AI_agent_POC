name: Terraform Dynamic Infra Deployment Pipeline

on:
  workflow_dispatch: {}
  push:
    branches:
      - feature/update-pipeline
      - 
    paths:
      - 'iaap-output/**'

concurrency:
  group: terraform-infra-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.13.0

jobs:

  # --------------------------------------------------------------------------
  # 1. Detect and Classify Changed Resources
  # --------------------------------------------------------------------------
  detect-and-classify:
    name: Detect and Classify Resources
    runs-on: ubuntu-latest
    outputs:
      stage1_network: ${{ steps.classify.outputs.stage1_network }}
      stage2_workload: ${{ steps.classify.outputs.stage2_workload }}
      has_stage1: ${{ steps.classify.outputs.has_stage1 }}
      has_stage2: ${{ steps.classify.outputs.has_stage2 }}
      total_count: ${{ steps.classify.outputs.total_count }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inspect and Classify Changed Directories
        id: classify
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/classify_changes.py


  # --------------------------------------------------------------------------
  # 2. Stage 1: Networking Provisioning (VPC / VNet)
  # --------------------------------------------------------------------------
  stage1-networking:
    name: "Stage 1: Network - ${{ matrix.item.directory }}"
    needs: detect-and-classify
    if: needs.detect-and-classify.outputs.has_stage1 == 'true'
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      matrix:
        item: ${{ fromJson(needs.detect-and-classify.outputs.stage1_network) }}
      fail-fast: false

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ matrix.item.region || vars.AWS_REGION || 'us-east-1' }}
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
      GOOGLE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate Cloud Provider
        uses: ./.github/actions/setup-cloud-auth
        with:
          provider: ${{ matrix.item.provider }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: ${{ matrix.item.region || vars.AWS_REGION || 'us-east-1' }}
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform Plan
        id: tf_plan
        uses: ./.github/actions/terraform-plan
        with:
          directory: ${{ matrix.item.directory }}
          backend_type: ${{ matrix.item.backend_type }}
          state_key: ${{ matrix.item.state_key }}
          tf_version: ${{ env.TF_VERSION }}
          azure_rg: ${{ secrets.AZURE_RESOURCE_GROUP }}
          azure_storage_account: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          azure_container: ${{ vars.AZURE_STORAGE_CONTAINER_NAME || 'deploy-storage' }}
          azure_access_key: ${{ secrets.ARM_ACCESS_KEY }}
          s3_bucket: ${{ vars.AWS_TF_STATE_BUCKET || secrets.AWS_TF_STATE_BUCKET || 'daas-terraform-state' }}
          aws_region: ${{ matrix.item.region || vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform Apply
        uses: ./.github/actions/terraform-apply
        with:
          directory: ${{ matrix.item.directory }}
          backend_type: ${{ matrix.item.backend_type }}
          state_key: ${{ matrix.item.state_key }}
          artifact_name: ${{ steps.tf_plan.outputs.artifact_name }}
          tf_version: ${{ env.TF_VERSION }}
          azure_rg: ${{ secrets.AZURE_RESOURCE_GROUP }}
          azure_storage_account: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          azure_container: ${{ vars.AZURE_STORAGE_CONTAINER_NAME || 'deploy-storage' }}
          azure_access_key: ${{ secrets.ARM_ACCESS_KEY }}
          s3_bucket: ${{ vars.AWS_TF_STATE_BUCKET || secrets.AWS_TF_STATE_BUCKET || 'daas-terraform-state' }}
          aws_region: ${{ matrix.item.region || vars.AWS_REGION || 'us-east-1' }}

      - name: Post-Provision Networking Action
        uses: ./.github/actions/post-provision-networking
        with:
          directory: ${{ matrix.item.directory }}
          provider: ${{ matrix.item.provider }}

      - name: Record Execution Outputs to Database
        if: always()
        uses: ./.github/actions/record-execution-outputs
        with:
          directory: ${{ matrix.item.directory }}
          provider: ${{ matrix.item.provider }}
          job_id: ${{ matrix.item.job_id }}
          database_url: ${{ secrets.DATABASE_URL || secrets.AZURE_POSTGRES_URL || secrets.SUPABASE_DB_URL }}
          commit_sha: ${{ github.sha }}
          run_id: ${{ github.run_id }}
          job_status: ${{ job.status }}


  # --------------------------------------------------------------------------
  # 3. Stage 2: Workload Provisioning (Kubernetes Clusters, Databases, etc.)
  # --------------------------------------------------------------------------
  stage2-workloads:
    name: "Stage 2: Workload - ${{ matrix.item.directory }}"
    needs: [detect-and-classify, stage1-networking]
    if: |
      always() &&
      needs.detect-and-classify.outputs.has_stage2 == 'true' &&
      (needs.stage1-networking.result == 'success' || needs.stage1-networking.result == 'skipped')
    runs-on: ubuntu-latest

    environment:
      name: dev

    strategy:
      max-parallel: 1
      matrix:
        item: ${{ fromJson(needs.detect-and-classify.outputs.stage2_workload) }}
      fail-fast: false

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ matrix.item.region || vars.AWS_REGION || 'us-east-1' }}
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
      GOOGLE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      TF_VAR_db_password: ${{ secrets.RDS_DB_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate Cloud Provider
        uses: ./.github/actions/setup-cloud-auth
        with:
          provider: ${{ matrix.item.provider }}
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: ${{ matrix.item.region || vars.AWS_REGION || 'us-east-1' }}
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform Plan
        id: tf_plan
        uses: ./.github/actions/terraform-plan
        with:
          directory: ${{ matrix.item.directory }}
          backend_type: ${{ matrix.item.backend_type }}
          state_key: ${{ matrix.item.state_key }}
          tf_version: ${{ env.TF_VERSION }}
          azure_rg: ${{ secrets.AZURE_RESOURCE_GROUP }}
          azure_storage_account: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          azure_container: ${{ vars.AZURE_STORAGE_CONTAINER_NAME || 'deploy-storage' }}
          azure_access_key: ${{ secrets.ARM_ACCESS_KEY }}
          s3_bucket: ${{ vars.AWS_TF_STATE_BUCKET || secrets.AWS_TF_STATE_BUCKET || 'daas-terraform-state' }}
          aws_region: ${{ matrix.item.region || vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform Apply
        uses: ./.github/actions/terraform-apply
        with:
          directory: ${{ matrix.item.directory }}
          backend_type: ${{ matrix.item.backend_type }}
          state_key: ${{ matrix.item.state_key }}
          artifact_name: ${{ steps.tf_plan.outputs.artifact_name }}
          tf_version: ${{ env.TF_VERSION }}
          azure_rg: ${{ secrets.AZURE_RESOURCE_GROUP }}
          azure_storage_account: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          azure_container: ${{ vars.AZURE_STORAGE_CONTAINER_NAME || 'deploy-storage' }}
          azure_access_key: ${{ secrets.ARM_ACCESS_KEY }}
          s3_bucket: ${{ vars.AWS_TF_STATE_BUCKET || secrets.AWS_TF_STATE_BUCKET || 'daas-terraform-state' }}
          aws_region: ${{ matrix.item.region || vars.AWS_REGION || 'us-east-1' }}

      # Call respective action for Kubernetes clusters (AKS / EKS / GKE)
      - name: Post-Provision Kubernetes Action
        if: matrix.item.resource_category == 'kubernetes'
        uses: ./.github/actions/post-provision-k8s
        with:
          directory: ${{ matrix.item.directory }}
          provider: ${{ matrix.item.provider }}
          region: ${{ matrix.item.region || vars.AWS_REGION || 'us-east-1' }}
          resource_group: ${{ secrets.AZURE_RESOURCE_GROUP }}

      # Call respective action for Databases (PostgreSQL / RDS / Redis)
      - name: Post-Provision Database Action
        if: matrix.item.resource_category == 'database'
        uses: ./.github/actions/post-provision-database
        with:
          directory: ${{ matrix.item.directory }}
          provider: ${{ matrix.item.provider }}

      - name: Record Execution Outputs to Database
        if: always()
        uses: ./.github/actions/record-execution-outputs
        with:
          directory: ${{ matrix.item.directory }}
          provider: ${{ matrix.item.provider }}
          job_id: ${{ matrix.item.job_id }}
          database_url: ${{ secrets.DATABASE_URL || secrets.AZURE_POSTGRES_URL || secrets.SUPABASE_DB_URL }}
          commit_sha: ${{ github.sha }}
          run_id: ${{ github.run_id }}
          job_status: ${{ job.status }}
