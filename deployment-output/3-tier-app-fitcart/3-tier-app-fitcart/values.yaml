# ============================================================
# DaaS Generated values.yaml for 3-tier-app-fitcart
# Override at deploy time with:
#   helm upgrade --install 3-tier-app-fitcart ./helm -f values-prod.yaml
#   or per-value: --set global.namespace=my-namespace
# ============================================================

global:
  # Target namespace — defaults to project name
  namespace: "3-tier-app-fitcart"
  # Container registry base URL
  registry: "azdaasdeployment.azurecr.io"
  # Ingress hostname
  ingressHost: "localhost"
  # Deployment strategy: rolling | blue-green | canary
  deploymentStrategy: "rolling"
  # Environment label
  environment: "dev"
  azureWorkloadIdentityClientId: ""
  secretProviderClass: ""

# ── Application Services ─────────────────────────────────
services:
  
  backend:
    enabled: true
    serviceName: "backend"
    containerPort: 8080
    replicaCount: 2
    image:
      repository: "azdaasdeployment.azurecr.io/backend"
      tag: "PLACEHOLDER_SET_BY_CI"
      pullPolicy: IfNotPresent
    ports:
      
      
      - 8080
      
      
    resources:
      requests:
        cpu: "500m"
        memory: "2048Mi"
      limits:
        cpu: "1000m"
        memory: "4096Mi"
    # Health check path — override if your app uses a different route
    healthCheckPath: "/actuator/health"
    env:
      
  
  frontend:
    enabled: true
    serviceName: "frontend"
    containerPort: 80
    replicaCount: 2
    image:
      repository: "azdaasdeployment.azurecr.io/frontend"
      tag: "PLACEHOLDER_SET_BY_CI"
      pullPolicy: IfNotPresent
    ports:
      
      
      - 80
      
      
    resources:
      requests:
        cpu: "500m"
        memory: "2048Mi"
      limits:
        cpu: "1000m"
        memory: "4096Mi"
    # Health check path — override if your app uses a different route
    healthCheckPath: "/"
    env:
      
  

# ── Database ─────────────────────────────────────────────

database:
  enabled: true
  inCluster: true
  connectionString: ""
  host: ""
  port: 5432
  name: ""
  user: ""
  migrations:
    enabled: false
  engine: "postgresql"
  image:
    repository: "postgres"
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  storage:
    size: "10Gi"
    storageClassName: "managed-csi"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  # Credentials are randomly generated at artifact creation time and stored
  # in the Kubernetes Secret 'postgresql-db-secret'. Do NOT override
  # these in CI — the Secret manifest already contains the real values.
  auth:
    
    POSTGRES_DB: "post_6xgevm"
    
    POSTGRES_USER: "post_h494l1"
    
    POSTGRES_PASSWORD: "3ucc5&Wm#XmDTM78sBZyA*fq"
    


# ── Ingress ──────────────────────────────────────────────
ingress:
  enabled: false
  className: "azure/application-gateway"
  host: "localhost"
  path: "/"
  tls: false
  tlsSecretName: "3-tier-app-fitcart-tls-secret"

# ── Autoscaling ──────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70