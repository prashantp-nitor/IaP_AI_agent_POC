apiVersion: v1
kind: Secret
metadata:
  name: postgresql-db-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    daas/secret-type: "database-credentials"
    daas/engine: "postgresql"
type: Opaque
stringData:
{{- if .Values.database.inCluster }}
  
  POSTGRES_DB: {{ index .Values.database.auth "POSTGRES_DB" | default "" | quote }}
  
  POSTGRES_USER: {{ index .Values.database.auth "POSTGRES_USER" | default "" | quote }}
  
  POSTGRES_PASSWORD: {{ index .Values.database.auth "POSTGRES_PASSWORD" | default "" | quote }}
  
  DATABASE_URL: {{ .Values.database.connectionString | quote }}
{{- else }}
  DATABASE_URL: {{ .Values.database.connectionString | quote }}
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USER: {{ .Values.database.user | quote }}
{{- end }}
