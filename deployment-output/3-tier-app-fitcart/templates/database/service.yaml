{{- if .Values.database.inCluster }}
apiVersion: v1
kind: Service
metadata:
  name: postgresql-db
  namespace: 3-tier-app-fitcart
  labels:
    app: postgresql-db
spec:
  # Headless service — StatefulSet pods get stable DNS names
  clusterIP: None
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: db
  selector:
    app: postgresql-db
{{- end }}
