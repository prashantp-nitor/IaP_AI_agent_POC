apiVersion: v1
kind: Secret
metadata:
  name: postgresql-db-secret
  namespace: billing-cart
  annotations:
    daas/secret-type: "database-credentials"
    daas/engine: "postgresql"
type: Opaque
stringData:
{{- if .Values.database.inCluster }}
  
  POSTGRES_DB: "post_lqxe72"
  
  POSTGRES_USER: "post_y2bxy3"
  
  POSTGRES_PASSWORD: "bhbkAP5bS#odu#knA0pRBa3p"
  
  DATABASE_URL: "postgresql://post_y2bxy3:bhbkAP5bS#odu#knA0pRBa3p@postgresql-db:5432/post_lqxe72"
{{- else }}
  DATABASE_URL: {{ .Values.database.connectionString | quote }}
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USER: {{ .Values.database.user | quote }}
{{- end }}
