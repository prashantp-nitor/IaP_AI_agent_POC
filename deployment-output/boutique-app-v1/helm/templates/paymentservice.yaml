# Standard Rolling Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
  namespace: boutique-app-v1
  labels:
    app: paymentservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paymentservice
  template:
    metadata:
      labels:
        app: paymentservice
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: paymentservice
          image: "{{ index .Values.services "paymentservice" "image" "repository" }}:{{ index .Values.services "paymentservice" "image" "tag" }}"
          imagePullPolicy: "{{ index .Values.services "paymentservice" "image" "pullPolicy" }}"
          
          ports:
            
            - containerPort: 50051
              name: port-50051
            
          
          env:
            
            - name: DISABLE_PROFILER
              
              value: "1"
              
            
            - name: PORT
              
              value: "50051"
              
            
            - name: DATABASE_URL
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: DATABASE_URL
              
            
            - name: DB_HOST
              
              value: "postgresql-db"
              
            
            - name: DB_PORT
              
              value: "5432"
              
            
            - name: DB_NAME
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_DB
              
            
            - name: DB_USER
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_USER
              
            
            - name: DB_PASSWORD
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_PASSWORD
              
            
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          
          

---
---
apiVersion: v1
kind: Service
metadata:
  name: paymentservice
  namespace: boutique-app-v1
  labels:
    app: paymentservice
spec:
  type: ClusterIP
  ports:
    
    - port: 50051
      targetPort: 50051
      protocol: TCP
      name: http-50051
    
  selector:
    app: paymentservice
    
---
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: paymentservice-config
  namespace: boutique-app-v1
data:
  
  DISABLE_PROFILER: "1"
  
  PORT: "50051"
