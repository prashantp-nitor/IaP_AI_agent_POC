# Standard Rolling Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppingassistantservice
  namespace: boutique-app-v1
  labels:
    app: shoppingassistantservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shoppingassistantservice
  template:
    metadata:
      labels:
        app: shoppingassistantservice
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: shoppingassistantservice
          image: "{{ index .Values.services "shoppingassistantservice" "image" "repository" }}:{{ index .Values.services "shoppingassistantservice" "image" "tag" }}"
          imagePullPolicy: "{{ index .Values.services "shoppingassistantservice" "image" "pullPolicy" }}"
          
          ports:
            
            - containerPort: 8080
              name: port-8080
            
          
          env:
            
            - name: PORT
              
              value: "80"
              
            
            - name: PYTHONUNBUFFERED
              
              value: "1"
              
            
            - name: DATABASE_URL
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: DATABASE_URL
              
            
            - name: DB_HOST
              
              value: "postgresql-db"
              
            
            - name: DB_PORT
              
              value: "5432"
              
            
            - name: DB_NAME
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_DB
              
            
            - name: DB_USER
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_USER
              
            
            - name: DB_PASSWORD
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_PASSWORD
              
            
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          
          

---
---
apiVersion: v1
kind: Service
metadata:
  name: shoppingassistantservice
  namespace: boutique-app-v1
  labels:
    app: shoppingassistantservice
spec:
  type: ClusterIP
  ports:
    
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http-8080
    
  selector:
    app: shoppingassistantservice
    
---
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shoppingassistantservice-config
  namespace: boutique-app-v1
data:
  
  PORT: "80"
  
  PYTHONUNBUFFERED: "1"
