# Standard Rolling Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: currencyservice
  namespace: boutique-app
  labels:
    app: currencyservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: currencyservice
  template:
    metadata:
      labels:
        app: currencyservice
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: currencyservice
          image: "{{ index .Values.services "currencyservice" "image" "repository" }}:{{ index .Values.services "currencyservice" "image" "tag" }}"
          imagePullPolicy: "{{ index .Values.services "currencyservice" "image" "pullPolicy" }}"
          
          ports:
            
            - containerPort: 7000
              name: port-7000
            
          
          env:
            
            - name: DISABLE_PROFILER
              
              value: "1"
              
            
            - name: PORT
              
              value: "7000"
              
            
            - name: DATABASE_URL
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: DATABASE_URL
              
            
            - name: DB_HOST
              
              value: "postgresql-db"
              
            
            - name: DB_PORT
              
              value: "5432"
              
            
            - name: DB_NAME
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_DB
              
            
            - name: DB_USER
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_USER
              
            
            - name: DB_PASSWORD
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_PASSWORD
              
            
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          
          

---
---
apiVersion: v1
kind: Service
metadata:
  name: currencyservice
  namespace: boutique-app
  labels:
    app: currencyservice
spec:
  type: ClusterIP
  ports:
    
    - port: 7000
      targetPort: 7000
      protocol: TCP
      name: http-7000
    
  selector:
    app: currencyservice
    
---
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: currencyservice-config
  namespace: boutique-app
data:
  
  DISABLE_PROFILER: "1"
  
  PORT: "7000"
