# ── In-Cluster Database ──────────────────────────────────

database:
  enabled: true
  engine: "postgresql"
  image:
    repository: "postgres"
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  port: 5432
  storage:
    size: "10Gi"
    storageClassName: "gp3"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "100m"
      memory: "256Mi"
  # Credentials are randomly generated at artifact creation time and stored
  # in the Kubernetes Secret 'postgresql-db-secret'. Do NOT override
  # these in CI — the Secret manifest already contains the real values.
  auth:
    
    POSTGRES_DB: "post_u3k192"
    
    POSTGRES_USER: "post_a72wjc"
    
    POSTGRES_PASSWORD: "tm*5BnqrxPTUH3rP3VB3bveU"
    


# ── Autoscaling ──────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70