# Standard Rolling Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adservice
  namespace: boutique-test
  labels:
    app: adservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adservice
  template:
    metadata:
      labels:
        app: adservice
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: adservice
          image: "{{ index .Values.services "adservice" "image" "repository" }}:{{ index .Values.services "adservice" "image" "tag" }}"
          imagePullPolicy: "{{ index .Values.services "adservice" "image" "pullPolicy" }}"
          
          ports:
            
            - containerPort: 9555
              name: port-9555
            
          
          env:
            
            - name: PORT
              
              value: "9555"
              
            
            - name: DATABASE_URL
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: DATABASE_URL
              
            
            - name: DB_HOST
              
              value: "postgresql-db"
              
            
            - name: DB_PORT
              
              value: "5432"
              
            
            - name: DB_NAME
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_DB
              
            
            - name: DB_USER
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_USER
              
            
            - name: DB_PASSWORD
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_PASSWORD
              
            
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "150m"
              memory: "256Mi"
          
          

---
---
apiVersion: v1
kind: Service
metadata:
  name: adservice
  namespace: boutique-test
  labels:
    app: adservice
spec:
  type: ClusterIP
  ports:
    
    - port: 9555
      targetPort: 9555
      protocol: TCP
      name: http-9555
    
  selector:
    app: adservice
    
---
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: adservice-config
  namespace: boutique-test
data:
  
  PORT: "9555"
