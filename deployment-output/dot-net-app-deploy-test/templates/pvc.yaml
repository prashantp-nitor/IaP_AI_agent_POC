apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlserver-data
  namespace: {{ .Values.services.sqlserver.namespace | default (.Values.global.namespace | default .Release.Namespace) }}
  labels:
    app: {{ .Values.services.sqlserver.serviceName | default "sqlserver" }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.services.sqlserver.storageSize | default "10Gi" }}
