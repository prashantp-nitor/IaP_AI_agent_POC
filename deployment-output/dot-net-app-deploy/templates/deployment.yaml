# Standard Rolling Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.angular.serviceName | default "angular" }}
  namespace: {{ .Values.services.angular.namespace | default .Release.Namespace }}
  labels:
    app: backend
spec:
  replicas: {{ .Values.services.angular.replicaCount | default 2 }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (printf "%s-sa" (include "dot-net-app-deploy.name" .)) }}
      {{- if gt (len .Values.imagePullSecrets) 0 }}
      imagePullSecrets:
        {{- range $secretName := .Values.imagePullSecrets }}
        - name: {{ $secretName }}
        {{- end }}
      {{- else }}
      imagePullSecrets:
        - name: acr-pull-secret
      {{- end }}
      containers:
        - name: angular
          image: "{{ .Values.services.angular.image.repository }}:{{ .Values.services.angular.image.tag }}"
          imagePullPolicy: "{{ .Values.services.angular.image.pullPolicy }}"
          
          ports:
            
            - containerPort: {{ .Values.services.angular.containerPort | default 80 }}
              name: http
            
          
          
          env:
            
            - name: DATABASE_URL
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: DATABASE_URL
              
            
            - name: DB_HOST
              
              value: "postgresql-db"
              
            
            - name: DB_PORT
              
              value: "5432"
              
            
            - name: DB_NAME
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_DB
              
            
            - name: DB_USER
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_USER
              
            
            - name: DB_PASSWORD
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_PASSWORD
              
            
          
          resources:
            requests:
              cpu: "{{ .Values.services.angular.resources.requests.cpu | default "500m" }}"
              memory: "{{ .Values.services.angular.resources.requests.memory | default "512Mi" }}"
            limits:
              cpu: "{{ .Values.services.angular.resources.limits.cpu | default "1000m" }}"
              memory: "{{ .Values.services.angular.resources.limits.memory | default "1Gi" }}"
          {{- if .Values.global.secretProviderClass }}
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
          {{- end }}
      {{- if .Values.global.secretProviderClass }}
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.global.secretProviderClass | quote }}
      {{- end }}
      {{- $svcNodeSelector := index .Values.services "angular" "nodeSelector" }}
      {{- if or $svcNodeSelector .Values.nodeSelector }}
      nodeSelector:
        {{- if $svcNodeSelector }}
        {{- toYaml $svcNodeSelector | nindent 8 }}
        {{- else }}
        {{- toYaml .Values.nodeSelector | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- $svcTolerations := index .Values.services "angular" "tolerations" }}
      {{- if or $svcTolerations .Values.tolerations }}
      tolerations:
        {{- if $svcTolerations }}
        {{- toYaml $svcTolerations | nindent 8 }}
        {{- else }}
        {{- toYaml .Values.tolerations | nindent 8 }}
        {{- end }}
      {{- end }}
---
