# ============================================================
# DaaS Generated values.yaml for fitkart-de
# Override at deploy time with:
#   helm upgrade --install fitkart-de ./helm -f values-prod.yaml
#   or per-value: --set global.namespace=my-namespace
# ============================================================

global:
  # Target namespace — defaults to project name
  namespace: "fitkart-de"
  # Container registry base URL
  registry: "231733667519.dkr.ecr.ap-southeast-1.amazonaws.com"
  # Deployment strategy: rolling | blue-green | canary
  deploymentStrategy: "rolling"
  # Environment label
  environment: "production"

# ── Application Services ─────────────────────────────────
services:
  
  backend:
    enabled: true
    replicaCount: 2
    image:
      repository: "231733667519.dkr.ecr.ap-southeast-1.amazonaws.com/backend"
      tag: "PLACEHOLDER_SET_BY_CI"
      pullPolicy: IfNotPresent
    ports:
      
      
      - 8080
      
      
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
    # Health check path — override if your app uses a different route
    healthCheckPath: "/actuator/health"
    env:
      
  
  frontend:
    enabled: true
    replicaCount: 2
    image:
      repository: "231733667519.dkr.ecr.ap-southeast-1.amazonaws.com/frontend"
      tag: "PLACEHOLDER_SET_BY_CI"
      pullPolicy: IfNotPresent
    ports:
      
      
      - 80
      
      
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
    # Health check path — override if your app uses a different route
    healthCheckPath: "/"
    env:
      
  

# ── In-Cluster Database ──────────────────────────────────

database:
  enabled: false


# ── Autoscaling ──────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70