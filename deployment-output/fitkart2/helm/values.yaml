# ============================================================
# DaaS Generated values.yaml for fitkart2
# Override at deploy time with:
#   helm upgrade --install fitkart2 ./helm -f values-prod.yaml
#   or per-value: --set global.namespace=my-namespace
# ============================================================

global:
  # Target namespace — defaults to project name
  namespace: "fitkart2"
  # Container registry base URL
  registry: "azdaasdeployment.azurecr.io"
  # Deployment strategy: rolling | blue-green | canary
  deploymentStrategy: "rolling"
  # Environment label
  environment: "production"

# ── Application Services ─────────────────────────────────
services:
  
  backend:
    enabled: true
    replicaCount: 2
    image:
      repository: "azdaasdeployment.azurecr.io/backend"
      tag: "PLACEHOLDER_SET_BY_CI"
      pullPolicy: IfNotPresent
    ports:
      
      
      - 8080
      
      
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "250m"
        memory: "512Mi"
    # Health check path — override if your app uses a different route
    healthCheckPath: "/actuator/health"
    env:
      
  
  frontend:
    enabled: true
    replicaCount: 2
    image:
      repository: "azdaasdeployment.azurecr.io/frontend"
      tag: "PLACEHOLDER_SET_BY_CI"
      pullPolicy: IfNotPresent
    ports:
      
      
      - 80
      
      
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "250m"
        memory: "512Mi"
    # Health check path — override if your app uses a different route
    healthCheckPath: "/"
    env:
      
  

# ── In-Cluster Database ──────────────────────────────────

database:
  enabled: true
  engine: "postgresql"
  image:
    repository: "postgres"
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  port: 5432
  storage:
    size: "10Gi"
    storageClassName: "managed-csi"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"
  # Credentials are randomly generated at artifact creation time and stored
  # in the Kubernetes Secret 'postgresql-db-secret'. Do NOT override
  # these in CI — the Secret manifest already contains the real values.
  auth:
    
    POSTGRES_DB: "post_kt328c"
    
    POSTGRES_USER: "post_vdg48w"
    
    POSTGRES_PASSWORD: "q%CN!5KmqtfZ7tDBMc#moNRT"
    


# ── Autoscaling ──────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70