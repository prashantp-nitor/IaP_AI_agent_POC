apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: {{ .Values.services.frontend.namespace | default .Release.Namespace }}
  labels:
    app: frontend
data:
  
  REACT_APP_API_URL: "http://backend.helm-only-deploy-backend.svc.cluster.local:8080"
  
  API_URL: "http://backend.helm-only-deploy-backend.svc.cluster.local:8080"
  
  
  default.conf: |
    server {
      listen {{ .Values.services.frontend.containerPort | default 80 }};

      location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
      }

      location /api/ {
        {{- if and .Values.services.backend .Values.services.backend.namespace }}
        proxy_pass http://{{ .Values.services.backend.serviceName | default "backend" }}.{{ .Values.services.backend.namespace }}.svc.cluster.local:{{ .Values.services.backend.containerPort | default 8080 }};
        {{- else if .Values.services.backend }}
        proxy_pass http://{{ .Values.services.backend.serviceName | default "backend" }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.services.backend.containerPort | default 8080 }};
        {{- else }}
        proxy_pass http://backend:8080;
        {{- end }}
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
    }
