# ============================================================
# Calico GlobalNetworkPolicies for Multi-Service Isolation
# ============================================================






# ── 1. Baseline DNS Egress ──────────────────────────────────
apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: helm-only-deploy-allow-dns
spec:

  namespaceSelector: projectcalico.org/name in {'helm-only-deploy-frontend', 'helm-only-deploy-backend', 'helm-only-deploy-database'}

  order: 50
  types:
    - Egress
  egress:
    - action: Allow
      protocol: UDP
      destination:
        ports:
          - 53
    - action: Allow
      protocol: TCP
      destination:
        ports:
          - 53
---
# ── 2. Frontend Tier Policy ─────────────────────────────────
apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: helm-only-deploy-frontend-policy
spec:
  namespaceSelector: projectcalico.org/name == 'helm-only-deploy-frontend'
  selector: app == 'frontend'
  order: 100
  types:
    - Ingress
    - Egress
  ingress:
    - action: Allow
      protocol: TCP
      destination:
        ports:
          - 80

    - action: Deny

  egress:
    - action: Allow
      protocol: TCP
      destination:

        namespaceSelector: projectcalico.org/name == 'helm-only-deploy-backend'

        selector: app == 'backend'
        ports:
          - 8080
    - action: Allow
      protocol: UDP
      destination:
        ports:
          - 53
    - action: Allow
      protocol: TCP
      destination:
        ports:
          - 53


    - action: Deny

---
# ── 3. Backend Tier Policy ──────────────────────────────────
apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: helm-only-deploy-backend-policy
spec:
  namespaceSelector: projectcalico.org/name == 'helm-only-deploy-backend'
  selector: app == 'backend'
  order: 100
  types:
    - Ingress
    - Egress
  ingress:
    - action: Allow
      protocol: TCP
      source:

        namespaceSelector: projectcalico.org/name == 'helm-only-deploy-frontend'

        selector: app == 'frontend'
      destination:
        ports:
          - 8080
    - action: Allow
      protocol: TCP
      source:
        nets:
          - [REDACTED_IPV4_ADDRESS_7]/32
          - [REDACTED_IPV4_ADDRESS_1]/24
      destination:
        ports:
          - 8080

    - action: Deny

  egress:

    - action: Allow
      protocol: TCP
      destination:

        namespaceSelector: projectcalico.org/name == 'helm-only-deploy-database'

        selector: app == 'database'
        ports:
          - 5432


    - action: Allow
      protocol: UDP
      destination:
        ports:
          - 53
    - action: Allow
      protocol: TCP
      destination:
        ports:
          - 53
    - action: Allow
      protocol: TCP
      destination:
        ports:
          - 443


    - action: Deny


---
# ── 4. Database Tier Policy ─────────────────────────────────
apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: helm-only-deploy-db-5432
spec:
  namespaceSelector: projectcalico.org/name == 'helm-only-deploy-database'
  selector: app == 'database'
  order: 100
  types:
    - Ingress
    - Egress
  ingress:
    - action: Allow
      protocol: TCP
      source:

        namespaceSelector: projectcalico.org/name == 'helm-only-deploy-backend'

        selector: app == 'backend'
      destination:
        ports:
          - 5432
    - action: Allow
      protocol: TCP
      source:
        nets:
          - [REDACTED_IPV4_ADDRESS_7]/32
          - [REDACTED_IPV4_ADDRESS_1]/24
      destination:
        ports:
          - 5432

    - action: Deny

  egress:
    - action: Allow
      protocol: UDP
      destination:
        ports:
          - 53
    - action: Allow
      protocol: TCP
      destination:
        ports:
          - 53

    - action: Deny
