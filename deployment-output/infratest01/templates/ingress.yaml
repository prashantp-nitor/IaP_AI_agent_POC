{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.services.frontend.serviceName | default "infratest01" }}-ingress
  namespace: {{ .Values.services.frontend.namespace | default .Release.Namespace }}
  annotations:
    appgw.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: {{ .Values.ingress.className | default "azure-application-gateway" }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName | default "infratest01-tls-secret" }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          
          - path: {{ .Values.ingress.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.services.frontend.serviceName | default "frontend" }}
                port:
                  number: {{ .Values.services.frontend.containerPort | default 80 }}
          
{{- end }}
