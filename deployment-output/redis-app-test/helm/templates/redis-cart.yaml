# Standard Rolling Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cart
  namespace: redis-app-test
  labels:
    app: redis-cart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cart
  template:
    metadata:
      labels:
        app: redis-cart
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: redis-cart
          image: "{{ index .Values.services "redis-cart" "image" "repository" }}:{{ index .Values.services "redis-cart" "image" "tag" }}"
          imagePullPolicy: "{{ index .Values.services "redis-cart" "image" "pullPolicy" }}"
          
          env:
            
            - name: DATABASE_URL
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: DATABASE_URL
              
            
            - name: DB_HOST
              
              value: "postgresql-db"
              
            
            - name: DB_PORT
              
              value: "5432"
              
            
            - name: DB_NAME
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_DB
              
            
            - name: DB_USER
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_USER
              
            
            - name: DB_PASSWORD
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_PASSWORD
              
            
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "150m"
              memory: "256Mi"
          
          

---
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cart
  namespace: redis-app-test
  labels:
    app: redis-cart
spec:
  type: ClusterIP
  ports:
    
    # No exposed ports detected, using default http port
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
    
  selector:
    app: redis-cart
    
---
