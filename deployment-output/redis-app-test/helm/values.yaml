# ── In-Cluster Database ──────────────────────────────────

database:
  enabled: true
  engine: "postgresql"
  image:
    repository: "postgres"
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  port: 5432
  storage:
    size: "10Gi"
    storageClassName: "managed-csi"
  resources:
    requests:
      cpu: "150m"
      memory: "256Mi"
    limits:
      cpu: "150m"
      memory: "256Mi"
  # Credentials are randomly generated at artifact creation time and stored
  # in the Kubernetes Secret 'postgresql-db-secret'. Do NOT override
  # these in CI — the Secret manifest already contains the real values.
  auth:
    
    POSTGRES_DB: "post_tn7xrt"
    
    POSTGRES_USER: "post_nt7a3z"
    
    POSTGRES_PASSWORD: "x9^M!1F^ktqFC!aMs4MBPgrf"
    


# ── Autoscaling ──────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70