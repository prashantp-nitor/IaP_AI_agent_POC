# Standard Rolling Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
  namespace: redis-app
  labels:
    app: productcatalogservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productcatalogservice
  template:
    metadata:
      labels:
        app: productcatalogservice
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: productcatalogservice
          image: "{{ index .Values.services "productcatalogservice" "image" "repository" }}:{{ index .Values.services "productcatalogservice" "image" "tag" }}"
          imagePullPolicy: "{{ index .Values.services "productcatalogservice" "image" "pullPolicy" }}"
          
          ports:
            
            - containerPort: 3550
              name: port-3550
            
          
          env:
            
            - name: DISABLE_PROFILER
              
              value: "1"
              
            
            - name: GOTRACEBACK
              
              value: "50051"
              
            
            - name: PORT
              
              value: "3550"
              
            
            - name: SKAFFOLD_GO_GCFLAGS
              
              value: "a"
              
            
            - name: TARGETARCH
              
              value: "amd64"
              
            
            - name: TARGETOS
              
              value: "linux"
              
            
            - name: DATABASE_URL
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: DATABASE_URL
              
            
            - name: DB_HOST
              
              value: "postgresql-db"
              
            
            - name: DB_PORT
              
              value: "5432"
              
            
            - name: DB_NAME
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_DB
              
            
            - name: DB_USER
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_USER
              
            
            - name: DB_PASSWORD
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_PASSWORD
              
            
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "150m"
              memory: "256Mi"
          
          

---
---
apiVersion: v1
kind: Service
metadata:
  name: productcatalogservice
  namespace: redis-app
  labels:
    app: productcatalogservice
spec:
  type: ClusterIP
  ports:
    
    - port: 3550
      targetPort: 3550
      protocol: TCP
      name: http-3550
    
  selector:
    app: productcatalogservice
    
---
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: productcatalogservice-config
  namespace: redis-app
data:
  
  DISABLE_PROFILER: "1"
  
  GOTRACEBACK: "50051"
  
  PORT: "3550"
  
  SKAFFOLD_GO_GCFLAGS: "a"
  
  TARGETARCH: "amd64"
  
  TARGETOS: "linux"
