# Standard Rolling Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
  namespace: test-boutique-1
  labels:
    app: cartservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cartservice
  template:
    metadata:
      labels:
        app: cartservice
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: cartservice
          image: "{{ index .Values.services "cartservice" "image" "repository" }}:{{ index .Values.services "cartservice" "image" "tag" }}"
          imagePullPolicy: "{{ index .Values.services "cartservice" "image" "pullPolicy" }}"
          
          ports:
            
            - containerPort: 7070
              name: port-7070
            
          
          env:
            
            - name: DOTNET_ENABLEDIAGNOSTICS
              
              value: "0"
              
            
            - name: PORT
              
              value: "7070"
              
            
            - name: REDIS_ADDR
              
              value: "master.fitcart-valkey-cache.vnfqg9.apse1.cache.amazonaws.com:6379,ssl=True,abortConnect=False"
              
            
            - name: TARGETARCH
              
              value: "amd64"
              
            
            - name: DATABASE_URL
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: DATABASE_URL
              
            
            - name: DB_HOST
              
              value: "postgresql-db"
              
            
            - name: DB_PORT
              
              value: "5432"
              
            
            - name: DB_NAME
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_DB
              
            
            - name: DB_USER
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_USER
              
            
            - name: DB_PASSWORD
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_PASSWORD
              
            
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          
          

---
---
apiVersion: v1
kind: Service
metadata:
  name: cartservice
  namespace: test-boutique-1
  labels:
    app: cartservice
spec:
  type: ClusterIP
  ports:
    
    - port: 7070
      targetPort: 7070
      protocol: TCP
      name: http-7070
    
  selector:
    app: cartservice
    
---
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cartservice-config
  namespace: test-boutique-1
data:
  
  DOTNET_ENABLEDIAGNOSTICS: "0"
  
  PORT: "7070"
  
  REDIS_ADDR: "master.fitcart-valkey-cache.vnfqg9.apse1.cache.amazonaws.com:6379,ssl=True,abortConnect=False"
  
  TARGETARCH: "amd64"
