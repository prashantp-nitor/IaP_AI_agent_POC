# Standard Rolling Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice
  namespace: test-boutique-1
  labels:
    app: emailservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emailservice
  template:
    metadata:
      labels:
        app: emailservice
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: emailservice
          image: "{{ index .Values.services "emailservice" "image" "repository" }}:{{ index .Values.services "emailservice" "image" "tag" }}"
          imagePullPolicy: "{{ index .Values.services "emailservice" "image" "pullPolicy" }}"
          
          ports:
            
            - containerPort: 8080
              name: port-8080
            
          
          env:
            
            - name: DISABLE_PROFILER
              
              value: "1"
              
            
            - name: ENABLE_PROFILER
              
              value: "0"
              
            
            - name: PORT
              
              value: "5000"
              
            
            - name: PYTHONDONTWRITEBYTECODE
              
              value: "1"
              
            
            - name: PYTHONUNBUFFERED
              
              value: "1"
              
            
            - name: DATABASE_URL
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: DATABASE_URL
              
            
            - name: DB_HOST
              
              value: "postgresql-db"
              
            
            - name: DB_PORT
              
              value: "5432"
              
            
            - name: DB_NAME
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_DB
              
            
            - name: DB_USER
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_USER
              
            
            - name: DB_PASSWORD
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_PASSWORD
              
            
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          
          

---
---
apiVersion: v1
kind: Service
metadata:
  name: emailservice
  namespace: test-boutique-1
  labels:
    app: emailservice
spec:
  type: ClusterIP
  ports:
    
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http-8080
    
  selector:
    app: emailservice
    
---
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: emailservice-config
  namespace: test-boutique-1
data:
  
  DISABLE_PROFILER: "1"
  
  ENABLE_PROFILER: "0"
  
  PORT: "5000"
  
  PYTHONDONTWRITEBYTECODE: "1"
  
  PYTHONUNBUFFERED: "1"
