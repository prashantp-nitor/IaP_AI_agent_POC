# Standard Rolling Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: test-boutique-1
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: frontend
          image: "{{ index .Values.services "frontend" "image" "repository" }}:{{ index .Values.services "frontend" "image" "tag" }}"
          imagePullPolicy: "{{ index .Values.services "frontend" "image" "pullPolicy" }}"
          
          ports:
            
            - containerPort: 8080
              name: port-8080
            
          
          env:
            
            - name: AD_SERVICE_ADDR
              
              value: "adservice:9555"
              
            
            - name: CART_SERVICE_ADDR
              
              value: "cartservice:7070"
              
            
            - name: CHECKOUT_SERVICE_ADDR
              
              value: "checkoutservice:5050"
              
            
            - name: CURRENCY_SERVICE_ADDR
              
              value: "currencyservice:7000"
              
            
            - name: CYMBAL_BRANDING
              
              value: "false"
              
            
            - name: ENV_PLATFORM
              
              value: "azure"
              
            
            - name: GOTRACEBACK
              
              value: "single"
              
            
            - name: PORT
              
              value: "8080"
              
            
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              
              value: "productcatalogservice:3550"
              
            
            - name: RECOMMENDATION_SERVICE_ADDR
              
              value: "recommendationservice:8080"
              
            
            - name: SHIPPING_SERVICE_ADDR
              
              value: "shippingservice:50051"
              
            
            - name: SHOPPING_ASSISTANT_SERVICE_ADDR
              
              value: "shoppingassistantservice:80"
              
            
            - name: SKAFFOLD_GO_GCFLAGS
              
              value: "a"
              
            
            - name: TARGETARCH
              
              value: "amd64"
              
            
            - name: TARGETOS
              
              value: "linux"
              
            
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          
          

---
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: test-boutique-1
  labels:
    app: frontend
spec:
  type: LoadBalancer
  ports:
    
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http-8080
    
  selector:
    app: frontend
    
---
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: test-boutique-1
data:
  
  AD_SERVICE_ADDR: "adservice:9555"
  
  CART_SERVICE_ADDR: "cartservice:7070"
  
  CHECKOUT_SERVICE_ADDR: "checkoutservice:5050"
  
  CURRENCY_SERVICE_ADDR: "currencyservice:7000"
  
  CYMBAL_BRANDING: "false"
  
  ENV_PLATFORM: "azure"
  
  GOTRACEBACK: "single"
  
  PORT: "8080"
  
  PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
  
  RECOMMENDATION_SERVICE_ADDR: "recommendationservice:8080"
  
  SHIPPING_SERVICE_ADDR: "shippingservice:50051"
  
  SHOPPING_ASSISTANT_SERVICE_ADDR: "shoppingassistantservice:80"
  
  SKAFFOLD_GO_GCFLAGS: "a"
  
  TARGETARCH: "amd64"
  
  TARGETOS: "linux"
