# Standard Rolling Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgenerator
  namespace: test-boutique
  labels:
    app: loadgenerator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgenerator
  template:
    metadata:
      labels:
        app: loadgenerator
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: loadgenerator
          image: "{{ index .Values.services "loadgenerator" "image" "repository" }}:{{ index .Values.services "loadgenerator" "image" "tag" }}"
          imagePullPolicy: "{{ index .Values.services "loadgenerator" "image" "pullPolicy" }}"
          
          env:
            
            - name: FRONTEND_ADDR
              
              value: "frontend:80"
              
            
            - name: GEVENT_SUPPORT
              
              value: "True"
              
            
            - name: PYTHONDONTWRITEBYTECODE
              
              value: "1"
              
            
            - name: PYTHONUNBUFFERED
              
              value: "1"
              
            
            - name: USERS
              
              value: "10"
              
            
            - name: DATABASE_URL
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: DATABASE_URL
              
            
            - name: DB_HOST
              
              value: "postgresql-db"
              
            
            - name: DB_PORT
              
              value: "5432"
              
            
            - name: DB_NAME
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_DB
              
            
            - name: DB_USER
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_USER
              
            
            - name: DB_PASSWORD
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_PASSWORD
              
            
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "150m"
              memory: "256Mi"
          
          

---
---
apiVersion: v1
kind: Service
metadata:
  name: loadgenerator
  namespace: test-boutique
  labels:
    app: loadgenerator
spec:
  type: ClusterIP
  ports:
    
    # No exposed ports detected, using default http port
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
    
  selector:
    app: loadgenerator
    
---
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadgenerator-config
  namespace: test-boutique
data:
  
  FRONTEND_ADDR: "frontend:80"
  
  GEVENT_SUPPORT: "True"
  
  PYTHONDONTWRITEBYTECODE: "1"
  
  PYTHONUNBUFFERED: "1"
  
  USERS: "10"
