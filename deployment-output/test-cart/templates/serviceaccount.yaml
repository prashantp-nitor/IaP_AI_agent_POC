{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ template "test-cart.name" . }}
  {{- if .Values.serviceAccount.labels }}
  {{- toYaml .Values.serviceAccount.labels | nindent 4 }}
  {{- end }}
  {{- if or .Values.serviceAccount.annotations .Values.global.azureWorkloadIdentityClientId }}
  annotations:
    {{- if .Values.global.azureWorkloadIdentityClientId }}
    azure.workload.identity/client-id: {{ .Values.global.azureWorkloadIdentityClientId | quote }}
    {{- end }}
    {{- if .Values.serviceAccount.annotations }}
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
    {{- end }}
  {{- end }}
{{- if gt (len .Values.imagePullSecrets) 0 }}
imagePullSecrets:
  {{- range $secretName := .Values.imagePullSecrets }}
  - name: {{ $secretName }}
  {{- end }}
{{- end }}
{{- end }}
