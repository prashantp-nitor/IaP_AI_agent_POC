# ============================================================
# DaaS Generated values.yaml for test-demo-20
# Override at deploy time with:
#   helm upgrade --install test-demo-20 ./helm -f values-prod.yaml
#   or per-value: --set global.namespace=my-namespace
# ============================================================

global:
  # Target namespace — defaults to project name
  namespace: "test-demo-20"
  # Container registry base URL
  registry: "azdaasdeployment.azurecr.io"
  # Ingress hostname
  ingressHost: "test-demo-20.local"
  # Deployment strategy: rolling | blue-green | canary
  deploymentStrategy: "rolling"
  # Environment label
  environment: "production"
  azureWorkloadIdentityClientId: ""
  secretProviderClass: ""

# ── Service Account ──────────────────────────────────────
serviceAccount:
  create: true
  name: "test-demo-20-sa"
  labels: {}
  annotations:
    

imagePullSecrets: []

# ── Health Probes ────────────────────────────────────────
probes:
  readiness:
    enabled: true
    type: httpGet
    path: /actuator/health/readiness
    port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1

  liveness:
    enabled: true
    type: httpGet
    path: /actuator/health/liveness
    port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1

  startup:
    enabled: false
    type: httpGet
    path: /actuator/health
    port: http
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 30

# ── Resources ────────────────────────────────────────────
resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts and applications run on clusters
  # with insufficient resources.
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

# ── Application Services ─────────────────────────────────
services:
  
  backend:
    enabled: true
    serviceName: "backend"
    containerPort: 8080
    replicaCount: 2
    image:
      repository: "azdaasdeployment.azurecr.io/backend"
      tag: "PLACEHOLDER_SET_BY_CI"
      pullPolicy: IfNotPresent
    ports:
      
      
      - 8080
      
      
    resources:
      requests:
        cpu: "500m"
        memory: "2048Mi"
      limits:
        cpu: "1000m"
        memory: "4096Mi"
    # Health check path — override if your app uses a different route
    healthCheckPath: "/actuator/health"
    env:
      
  
  frontend:
    enabled: true
    serviceName: "frontend"
    containerPort: 80
    replicaCount: 2
    image:
      repository: "azdaasdeployment.azurecr.io/frontend"
      tag: "PLACEHOLDER_SET_BY_CI"
      pullPolicy: IfNotPresent
    ports:
      
      
      - 80
      
      
    resources:
      requests:
        cpu: "500m"
        memory: "2048Mi"
      limits:
        cpu: "1000m"
        memory: "4096Mi"
    # Health check path — override if your app uses a different route
    healthCheckPath: "/"
    env:
      
  

# ── Database ─────────────────────────────────────────────

