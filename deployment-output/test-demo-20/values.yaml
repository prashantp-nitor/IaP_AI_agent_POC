  host: "{'type': 'string', 'value': 'test-demo-20-db.postgres.database.azure.com', 'sensitive': False}"
  port: 5432
  name: "{'type': 'string', 'value': 'appdb', 'sensitive': False}"
  user: "{'type': 'string', 'value': 'pgadmin', 'sensitive': False}"
