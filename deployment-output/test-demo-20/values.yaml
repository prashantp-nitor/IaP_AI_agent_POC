# ── Ingress ──────────────────────────────────────────────
ingress:
  enabled: false
  className: "azure-application-gateway"
  host: "test-demo-20.local"
  path: "/"
  tls: false
  tlsSecretName: "test-demo-20-tls-secret"

# ── Autoscaling ──────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80