apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.backend.serviceName | default "backend" }}
  namespace: {{ .Values.services.backend.namespace | default .Release.Namespace }}
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
    
    - port: {{ index .Values.services.backend.ports 0 | default 8080 }}
      targetPort: {{ .Values.services.backend.containerPort | default 8080 }}
      protocol: TCP
      name: http
    
  selector:
    app: backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.frontend.serviceName | default "frontend" }}
  namespace: {{ .Values.services.frontend.namespace | default .Release.Namespace }}
  labels:
    app: frontend
spec:
  type: ClusterIP
  ports:
    
    - port: {{ index .Values.services.frontend.ports 0 | default 80 }}
      targetPort: {{ .Values.services.frontend.containerPort | default 80 }}
      protocol: TCP
      name: http
    
  selector:
    app: frontend
