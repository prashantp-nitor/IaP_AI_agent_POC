# ============================================================
# DaaS Generated values.yaml for test-demo-22 helm
# Override at deploy time with:
#   helm upgrade --install test-demo-22 ./helm -f values-prod.yaml
#   or per-value: --set global.namespace=my-namespace
# ============================================================

global:
  # Target namespace — defaults to project name
  namespace: "test-demo-22"
  # Container registry base URL
  registry: "azdaasdeployment.azurecr.io"
  # Ingress hostname
  ingressHost: "test-demo-22.local"
  # Deployment strategy: rolling | blue-green | canary
  deploymentStrategy: "rolling"
  # Environment label
  environment: "production"
  azureWorkloadIdentityClientId: ""
  secretProviderClass: ""

# ── Service Account ──────────────────────────────────────
serviceAccount:
  create: true
  name: "test-demo-22-sa"
  labels: {}
  annotations:
    

imagePullSecrets: []

# ── Health Probes ────────────────────────────────────────
probes:
  readiness:
    enabled: true
    type: httpGet
    path: /actuator/health/readiness
    port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1

  liveness:
    enabled: true
    type: httpGet
    path: /actuator/health/liveness
    port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1

  startup:
    enabled: false
    type: httpGet
    path: /actuator/health
    port: http
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 30

# ── Resources ────────────────────────────────────────────
resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts and applications run on clusters
  # with insufficient resources.
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

# ── Application Services ─────────────────────────────────
services:
  
  backend:
    namespace: "test-demo-22"
    enabled: true
    serviceName: "backend"
    containerPort: 8080
    replicaCount: 1
    image:
      repository: "azdaasdeployment.azurecr.io"
      tag: "sha-80777f5c"
      pullPolicy: IfNotPresent
    ports:
      
      
      - 8080
      
      
    resources:
      requests:
        cpu: "500m"
        memory: "2048Mi"
      limits:
        cpu: "1000m"
        memory: "4096Mi"
    # Health check path — override if your app uses a different route
    healthCheckPath: "/actuator/health"
    env:
      
  
  frontend:
    namespace: "test-demo-22"
    enabled: true
    serviceName: "frontend"
    containerPort: 80
    replicaCount: 1
    image:
      repository: "azdaasdeployment.azurecr.io"
      tag: "sha-80777f5c"
      pullPolicy: IfNotPresent
    ports:
      
      
      - 80
      
      
    resources:
      requests:
        cpu: "500m"
        memory: "2048Mi"
      limits:
        cpu: "1000m"
        memory: "4096Mi"
    # Health check path — override if your app uses a different route
    healthCheckPath: "/"
    env:
      
  

# ── Database ─────────────────────────────────────────────

database:
  enabled: true
  inCluster: false
  connectionString: "test-demo-22-db.postgres.database.azure.com"
  host: "test"
  port: 5432
  name: "test-demo-22-db.postgres.database.azure.com"
  user: "pgadmin"
  password: ""
  migrations:
    enabled: true
  


# ── Ingress ──────────────────────────────────────────────
ingress:
  enabled: false
  className: "azure-application-gateway"
  host: "test-demo-22.local"
  path: "/"
  tls: false
  tlsSecretName: "test-demo-22-tls-secret"

# ── Autoscaling ──────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
