# Standard Rolling Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendationservice
  namespace: test-demo
  labels:
    app: recommendationservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendationservice
  template:
    metadata:
      labels:
        app: recommendationservice
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: recommendationservice
          image: "{{ index .Values.services "recommendationservice" "image" "repository" }}:{{ index .Values.services "recommendationservice" "image" "tag" }}"
          imagePullPolicy: "{{ index .Values.services "recommendationservice" "image" "pullPolicy" }}"
          
          ports:
            
            - containerPort: 8080
              name: port-8080
            
          
          env:
            
            - name: DISABLE_PROFILER
              
              value: "1"
              
            
            - name: PORT
              
              value: "8080"
              
            
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              
              value: "productcatalogservice:3550"
              
            
            - name: PYTHONDONTWRITEBYTECODE
              
              value: "1"
              
            
            - name: PYTHONUNBUFFERED
              
              value: "1"
              
            
            - name: DATABASE_URL
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: DATABASE_URL
              
            
            - name: DB_HOST
              
              value: "postgresql-db"
              
            
            - name: DB_PORT
              
              value: "5432"
              
            
            - name: DB_NAME
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_DB
              
            
            - name: DB_USER
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_USER
              
            
            - name: DB_PASSWORD
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_PASSWORD
              
            
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "150m"
              memory: "256Mi"
          
          

---
---
apiVersion: v1
kind: Service
metadata:
  name: recommendationservice
  namespace: test-demo
  labels:
    app: recommendationservice
spec:
  type: ClusterIP
  ports:
    
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http-8080
    
  selector:
    app: recommendationservice
    
---
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: recommendationservice-config
  namespace: test-demo
data:
  
  DISABLE_PROFILER: "1"
  
  PORT: "8080"
  
  PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
  
  PYTHONDONTWRITEBYTECODE: "1"
  
  PYTHONUNBUFFERED: "1"
