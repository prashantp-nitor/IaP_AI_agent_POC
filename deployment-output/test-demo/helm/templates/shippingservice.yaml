# Standard Rolling Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shippingservice
  namespace: test-demo
  labels:
    app: shippingservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shippingservice
  template:
    metadata:
      labels:
        app: shippingservice
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: shippingservice
          image: "{{ index .Values.services "shippingservice" "image" "repository" }}:{{ index .Values.services "shippingservice" "image" "tag" }}"
          imagePullPolicy: "{{ index .Values.services "shippingservice" "image" "pullPolicy" }}"
          
          ports:
            
            - containerPort: 50051
              name: port-50051
            
          
          env:
            
            - name: APP_PORT
              
              value: "50051"
              
            
            - name: DISABLE_PROFILER
              
              value: "1"
              
            
            - name: GOTRACEBACK
              
              value: "single"
              
            
            - name: PORT
              
              value: "50051"
              
            
            - name: SKAFFOLD_GO_GCFLAGS
              
              value: "a"
              
            
            - name: TARGETARCH
              
              value: "amd64"
              
            
            - name: TARGETOS
              
              value: "linux"
              
            
            - name: DATABASE_URL
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: DATABASE_URL
              
            
            - name: DB_HOST
              
              value: "postgresql-db"
              
            
            - name: DB_PORT
              
              value: "5432"
              
            
            - name: DB_NAME
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_DB
              
            
            - name: DB_USER
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_USER
              
            
            - name: DB_PASSWORD
              
              valueFrom:
                secretKeyRef:
                  name: postgresql-db-secret
                  key: POSTGRES_PASSWORD
              
            
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "150m"
              memory: "256Mi"
          
          

---
---
apiVersion: v1
kind: Service
metadata:
  name: shippingservice
  namespace: test-demo
  labels:
    app: shippingservice
spec:
  type: ClusterIP
  ports:
    
    - port: 50051
      targetPort: 50051
      protocol: TCP
      name: http-50051
    
  selector:
    app: shippingservice
    
---
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shippingservice-config
  namespace: test-demo
data:
  
  APP_PORT: "50051"
  
  DISABLE_PROFILER: "1"
  
  GOTRACEBACK: "single"
  
  PORT: "50051"
  
  SKAFFOLD_GO_GCFLAGS: "a"
  
  TARGETARCH: "amd64"
  
  TARGETOS: "linux"
