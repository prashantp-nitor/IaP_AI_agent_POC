apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-rg-ingress
  namespace: test-rg
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    
spec:
  ingressClassName: azure/application-gateway
  rules:
    - http:
        paths:
          
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
