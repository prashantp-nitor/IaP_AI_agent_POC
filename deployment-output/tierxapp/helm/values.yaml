# ============================================================
# DaaS Generated values.yaml for tierxapp
# Override at deploy time with:
#   helm upgrade --install tierxapp ./helm -f values-prod.yaml
#   or per-value: --set global.namespace=my-namespace
# ============================================================

global:
  # Target namespace — defaults to project name
  namespace: "tierxapp"
  # Container registry base URL
  registry: "azdaasdeployment.azurecr.io"
  # Deployment strategy: rolling | blue-green | canary
  deploymentStrategy: "rolling"
  # Environment label
  environment: "production"

# ── Application Services ─────────────────────────────────
services:
  
  app:
    enabled: true
    replicaCount: 1
    image:
      repository: "azdaasdeployment.azurecr.io/app"
      tag: "PLACEHOLDER_SET_BY_CI"
      pullPolicy: IfNotPresent
    ports:
      
      
      - 80
      
      
    resources:
      requests:
        cpu: "500m"
        memory: "1024Mi"
      limits:
        cpu: "1000m"
        memory: "2048Mi"
    # Health check path — override if your app uses a different route
    healthCheckPath: "/"
    env:
      
  

# ── In-Cluster Database ──────────────────────────────────

database:
  enabled: false


# ── Autoscaling ──────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70